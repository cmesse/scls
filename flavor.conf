# SCLS local configuration. Picks the active flavor and any host-specific
# overrides. The flavor file itself lives in flavors/<flavor>.yaml.
flavor: macos

# Optional path to the Python interpreter used by the build system. Defaults
# to "python3" if unset. Useful when system python is too old or you want a
# specific install (e.g. /opt/scls/mkl/bin/python3).
# python: python3

# Use a Red Hat gcc-toolset for the build host. When set, the wrapper sources
# /opt/rh/gcc-toolset-<N>/enable before running the builder, putting the
# toolset's gcc/g++/gfortran (and binutils) at the front of PATH. The python
# builder also rewrites bootstrap_compilers to use the toolset binaries
# directly. This is the cleanest way to build SCLS on RHEL 8 (whose system
# gcc 8 is too old for modern scientific libraries).
# gcc_toolset: 15

# Extra packages to build for this host that the recipe's flavors: allowlist
# would otherwise exclude (e.g. building gcc/binutils for the gcc flavor on a
# host where the system toolchain is too old). Listing a package here both
# bypasses the recipe's flavor check at build time AND adds it to the
# scls-<flavor> meta-package as a Requires.
# extra_packages:
#   - binutils
#   - gcc
