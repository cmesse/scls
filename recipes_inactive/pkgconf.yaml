# nortte: using old pkg-conf instead because include flags do not work on mac
name: pkgconf
version: 2.4.3
summary: Package compiler and linker metadata toolkit
homepage: http://pkgconf.org/
license: GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Texinfo-exception AND GFDL-1.3-or-later AND FSFAP AND FSFUL AND FSFULLR AND FSFULLRWD AND X11 AND LicenseRef-Fedora-Public-Domain

source:
  url: https://distfiles.ariadne.space/pkgconf/pkgconf-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires:
  - autoconf
  - automake
  - libtool

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

install:
  post:
    - "ln -sv pkgconf %{prefix}/bin/pkg-config"
    - "ln -sv pkgconf.1 %{prefix}/share/man/man1/pkg-config.1"

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"