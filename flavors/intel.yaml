# Linux Intel OneAPI + MKL flavor configuration
name: intel
platform: linux
description: "Intel OneAPI compilers with OpenMPI and Intel MKL"
prefix: /opt/scls/intel

# Pre-build setup commands
pre_build_setup:
  - "source /opt/intel/oneapi/setvars.sh intel64"

# RPM package dependencies
rpm_build_requires:
  - intel-oneapi-compiler-fortran
  - intel-oneapi-compiler-dpcpp-cpp
  - intel-oneapi-mkl-devel
  - openmpi-devel

rpm_requires:
  - intel-oneapi-mkl
  - openmpi

compilers:
  cc: icx
  cxx: icpx
  fc: ifx

flags:
  cflags: "-march=x86-64-v3 -fPIC -fp-model=precise"
  cxxflags: "-march=x86-64-v3 -fPIC -fp-model=precise"
  fflags: "-march=x86-64-v3 -fPIC -fp-model=precise"
  ldflags: "-Wl,-rpath,%{prefix}/lib -L%{prefix}/lib"

# Math libraries configuration
math:
  linalg: mkl
  threading: intel
  interface: lp64  # 32-bit integers

# MPI implementation
mpi: openmpi

# We don't ship our own zlib RPM — recipes that need libz should use the
# distro's package (zlib at /usr/lib64/libz.so).
system_libraries:
  zlib: true
