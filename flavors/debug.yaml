# Linux GCC debug flavor — for use with valgrind, sanitizers, and gdb
name: debug
inherits: gcc
platform: linux
description: "Debug build with GCC compilers and reference BLAS/LAPACK"
prefix: /opt/scls/debug

# RPM package dependencies
rpm_build_requires:
  - gcc
  - gcc-c++
  - gcc-gfortran
  - rpm-build

bootstrap_packages:
  - cmake

compilers:
  cc: gcc
  cxx: g++
  fc: gfortran

flags:
  cflags: "-march=x86-64-v3 -Og -g -fPIC -fno-fast-math"
  cxxflags: "-march=x86-64-v3 -Og -g -fPIC -fno-fast-math"
  fflags: "-march=x86-64-v3 -Og -g -fPIC -fno-fast-math -fno-unsafe-math-optimizations"
  ldflags: "-Wl,-rpath,%{prefix}/lib -L%{prefix}/lib"

math:
  linalg: lapack
  threading: openmp
  interface: lp64

# We don't ship our own zlib RPM — recipes that need libz should use the
# distro's package (zlib at /usr/lib64/libz.so).
system_libraries:
  zlib: true