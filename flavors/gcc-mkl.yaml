name: gcc-mkl
platform: linux
description: "Production build with GCC compilers and Intel MKL"
prefix: /opt/scls/gcc-mkl

# Pre-build setup commands
pre_build_setup:
  - "source /opt/intel/oneapi/setvars.sh intel64"

# RPM package dependencies (for bootstrap packages only - we build our own GCC)
rpm_build_requires:
  - gcc
  - gcc-c++
  - gcc-gfortran
  - intel-oneapi-mkl-devel

rpm_requires:
  - intel-oneapi-mkl

# Default compilers (our custom GCC in prefix/bin - used for most packages)
compilers:
  cc: gcc
  cxx: g++
  fc: gfortran

# Bootstrap compilers (system GCC - used for core packages before our GCC is available)
# Packages with "bootstrap: true" in their recipe will use these compilers
bootstrap_compilers:
  cc: /usr/bin/gcc
  cxx: /usr/bin/g++
  fc: /usr/bin/gfortran

flags:
  cflags: "-march=x86-64-v3 -fPIC -fno-fast-math"
  cxxflags: "-march=x86-64-v3 -fPIC -fno-fast-math"
  fflags: "-march=x86-64-v3 -fPIC -fno-fast-math -fno-unsafe-math-optimizations"
  ldflags: "-Wl,-rpath,%{prefix}/lib -L%{prefix}/lib"

math:
  linalg: mkl
  threading: openmp
  interface: lp64  # 32-bit integers