# Linux Intel OneAPI + MKL flavor configuration
name: intel-mkl
platform: linux
description: "Intel OneAPI compilers with OpenMPI and Intel MKL"
prefix: /opt/scls/intel-mkl

compilers:
  cc: icx
  cxx: icpx
  fc: ifx

flags:
  cflags: "-mcpu=x86-64-v3 -fPIC -fp-model=precise"
  cxxflags: "-mcpu=x86-64-v3 -fPIC -fp-model=precise"
  fflags: "-mcpu=x86-64-v3 -fPIC -fp-model=precise"
  ldflags: "-Wl,-rpath,/opt/scls/lib -L/opt/scls/lib"
  configure: "--enable-shared --disable-static --host=%{host} --build=%{host} --target=%{host}"

# Math libraries configuration
math:
  linalg: mkl
  threading: intel
  interface: lp64  # 32-bit integers

# MPI implementation
mpi: openmpi