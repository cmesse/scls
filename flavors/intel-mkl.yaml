# Linux Intel OneAPI + MKL flavor configuration
name: intel-mkl
platform: linux
description: "Intel OneAPI compilers with OpenMPI and Intel MKL"
prefix: /opt/scls/intel-mkl

compilers:
  cc: icx
  cxx: icpx
  fc: ifx

flags:
  cflags: "-xHost -fPIC -fp-model=precise"
  cxxflags: "-xHost -fPIC -fp-model=precise"
  fflags: "-xHost -fPIC -fp-model=precise"
  ldflags: "-Wl,-rpath,/opt/scls/intel-mkl/lib"

# Math libraries configuration
math:
  linalg: mkl
  threading: intel
  interface: lp64  # 32-bit integers

# MPI implementation
mpi: openmpi