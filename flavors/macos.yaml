# macOS development flavor configuration
name: macos
platform: macos
description: "GNU toolkit and SCLS libraries for macOS"
prefix: /opt/scls

compilers:
  cc: clang
  cxx: clang++
  fc: gfortran

flags:
  cflags: "-g -fPIC -fno-fast-math -march=native"
  cxxflags: "-g -fPIC -fno-fast-math -march=native"
  fflags: "-g -fPIC -fno-fast-math -march=native"
  ldflags: "-Wl,-rpath,/opt/scls/lib"
  configure: "--enable-shared --disable-static --host=%{host} --build=%{host} --target=%{host}"

# Math libraries configuration
math:
  linalg: accelerate
  threading: openmp  # Link against gomp from gfortran
  interface: lp64