# macOS development flavor configuration
name: macos
platform: macos
description: "GNU toolkit and SCLS libraries for macOS"
prefix: /opt/scls

# Default compilers (GCC - used for most packages)
compilers:
  cc: gcc
  cxx: g++
  fc: gfortran

# Bootstrap compilers (Apple Clang - used for core packages before GCC is available)
# Packages with "bootstrap: true" in their recipe will use these compilers
bootstrap_compilers:
  cc: clang
  cxx: clang++

flags:
  cflags: "-g -fPIC -fno-fast-math -march=native"
  cxxflags: "-g -fPIC -fno-fast-math -march=native"
  fflags: "-g -fPIC -fno-fast-math -march=native"
  ldflags: "-Wl,-rpath,/opt/scls/lib -L/opt/scls/lib"

# Math libraries configuration
math:
  linalg: openblas
  threading: openmp
  interface: lp64