name: googletest
version: 1.18.0
summary: GoogleTest - Google Testing and Mocking Framework
homepage: https://github.com/google/googletest
license: BSD-3-Clause

source:
  url: https://github.com/google/googletest/releases/download/v%{version}/googletest-%{version}.tar.gz

requires:
  all:
    - cmake

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: cmake
  env:
    # googletest is self-contained -- it compiles nothing against %{prefix}.
    # setup_environment() prepends %{prefix}/include to CPATH, and gcc searches
    # CPATH *before* -isystem directories, which is how CMake hands
    # googletest/include to the gmock target (internal_utils.cmake marks the
    # gtest interface includes SYSTEM). On an in-place upgrade the already
    # installed gtest headers therefore shadow the in-tree ones and gmock is
    # compiled against the old ABI (1.17's MutexBase* MutexLock ctor, no
    # GTEST_INTERNAL_DEPRECATE_AND_INLINE). Clearing CPATH lets the source tree
    # win; an empty CPATH adds no directories (it is not treated as ".").
    CPATH: ""
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"

build:
  parallel: true

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lgtest -lgmock"
