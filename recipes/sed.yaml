name: sed
version: 4.9
summary: A GNU stream text editor
homepage: https://sed.sourceforge.net/
license: GPL-3.0-or-later
bootstrap: true  # Build with system Clang before GCC is available

source:
  url: https://ftp.gnu.org/pub/gnu/sed/sed-%{version}.tar.xz

# Only build for these flavors
include_flavors:
  - macos

requires:
  - automake
  - autoconf
  - make

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  args:
    - --disable-nls
  optimization:
    O_level: 2
    strict_aliasing: true
  flavor_args:
    macos:
      - "--program-prefix=g"
      - "--with-libintl-prefix=%{sdk}/usr"
build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"