name: gmp
version: 6.3.0
summary: GNU arbitrary precision library
homepage: https://gmplib.org/
license: LGPLv3+ or GPLv2+
# LGPL-3 / GPL-2 — not redistributed as an SCLS package on mainline Linux
# flavors. petsc links against the system gmp-devel there, and GCC consumes
# gmp via its `extra_sources:` block (in-tree build). Built in-stack only
# on `macos` (no reliable system gmp-devel) and `lbl` (LBL HPC target that
# maintains its own full toolchain).

source:
  url: https://ftp.gnu.org/gnu/gmp/gmp-%{version}.tar.xz

include_flavors:
  - macos
  - lbl

requires:
  # gmp is linked against libgcc_s; on every flavor where gmp is built
  # (macos, lbl) the stack's GCC is available, so carry this in `all:`.
  all:
    - gcc
  macos:
    - autoconf
    - automake
    - libtool
    - bison

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  # GCC 15+ is stricter about C23 compliance - GMP's configure tests use K&R style
  # function declarations that fail with modern GCC. Use gnu17 to allow older syntax.
  env:
    - CFLAGS: "+=-std=gnu17"
    - CXXFLAGS: "+=-std=gnu++17"
  args:
    - --enable-cxx
    - --with-pic
  # Flavor-specific configure arguments
  flavor_args:
    debug:
      - --enable-fat
    mkl:
      - --enable-fat
    intel:
      - --enable-fat
    macos:
      - --disable-assembly  # Avoid assembly issues on macOS
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check"

registry:
  ldflags: "-lgmp -lgmpxx"