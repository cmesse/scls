name: gmp
version: 6.3.0
summary: GNU arbitrary precision library
homepage: https://gmplib.org/
license: LGPLv3+ or GPLv2+
# Note: GMP is built in-tree during GCC compilation, then rebuilt standalone with GCC

source:
  url: https://gmplib.org/download/gmp/gmp-%{version}.tar.xz

requires:
  macos:
    - gcc  # Built after GCC so we can use GCC to compile
    - autoconf
    - automake
    - libtool
    - bison

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  # GCC 15+ is stricter about C23 compliance - GMP's configure tests use K&R style
  # function declarations that fail with modern GCC. Use gnu17 to allow older syntax.
  env:
    - CFLAGS: "+=-std=gnu17"
    - CXXFLAGS: "+=-std=gnu++17"
  args:
    - --enable-cxx
    - --with-pic
  # Flavor-specific configure arguments
  flavor_args:
    gcc-debug:
      - --enable-fat
    clang-debug:
      - --enable-fat
    gcc-mkl:
      - --enable-fat
    intel-mkl:
      - --enable-fat
    macos:
      - --disable-assembly  # Avoid assembly issues on macOS
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check"

registry:
  ldflags: "-lgmp -lgmpxx"