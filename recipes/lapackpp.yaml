name: lapackpp
version: 2025.05.28
summary: C++ API for the Linear Algebra Package (LAPACK)
homepage: https://icl.utk.edu/slate/
license: BSD-3-Clause

source:
  url: https://github.com/icl-utk-edu/lapackpp/releases/download/v%{version}/lapackpp-%{version}.tar.gz

patches:
  all:
    - lapackpp_lapacke_libpath.patch

requires:
  all:
    - cmake
    - blaspp
    - testsweeper

features:
  fortran: false
  mpi: false
  openmp: false
  math: serial

configure:
  type: cmake
  pre:
    - "LD_LIBRARY_PATH=%{prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}; export LD_LIBRARY_PATH"
  post:
    - "unset LD_LIBRARY_PATH"
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_BUILD_RPATH=%{prefix}/lib"
    # NB: CMAKE_LIBRARY_PATH and CMAKE_INCLUDE_PATH are set by build_common
    # (and extended with MKL paths for the mkl flavor); don't override here.
    - "-Dbuild_tests=ON"
  flavor_args:
    gcc:
      - "-Dlapack=auto"
      - "-Dgpu_backend=none"
      - '-DBLAS_LIBRARIES=-lopenblas'
      - '-DLAPACK_LIBRARIES=-llapack'
    macos:
      # lapackpp finds blaspp automatically; no BLA_VENDOR needed for OpenBLAS
      - "-Dlapack=auto"
      - "-Dgpu_backend=none"
      - '-DBLAS_LIBRARIES=-lopenblas'
      - '-DLAPACK_LIBRARIES=-llapack'
    debug:
      # Reference BLAS/LAPACK from our lapack build
      - "-Dlapack=generic"
      - "-Dgpu_backend=none"
      - '-DBLAS_LIBRARIES=-lblas'
      - '-DLAPACK_LIBRARIES=-llapack'
    mkl:
      # Prescribe MKL libraries explicitly — bypasses upstream LAPACKFinder
      # auto-detection entirely. MKL bundles BLAS+LAPACK in the same libs.
      # Threading: use gnu_thread (matching blaspp) for OpenMP applications.
      - "-Dgpu_backend=none"
    cuda:
      - "-Dgpu_backend=cuda"
  # LP64/ILP64 MKL library selection (interface inherited from blaspp)
  lp64_flavor_args:
    mkl:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
    cuda:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
  ilp64_flavor_args:
    mkl:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
    cuda:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
  optimization:
    O_level: 3

build:
  parallel: true
  in_source: false  # Build in separate directory

test:
  commands:
    # hegvd/hpgvd (Hermitian generalized eigenvalue divide-and-conquer) crash with
    # SIGSEGV against reference LAPACK / OpenBLAS — known LAPACK bug.
    #
    # gb* family (gbsv/gbtrf/gbtrs/gbcon/gbrfs) crashes against MKL: LAPACKE_zgbtrf
    # segfaults on 100x100 complex-double general band matrices when kl ~= n and
    # ku ~= n. Reproduced manually with `tester --type z --dim 100 --kl 100
    # --ku 100 gbtrf`. Bug is in MKL itself; the gb* routines that depend on
    # gbtrf cascade-fail. Exclude only for the mkl flavor.
    - |
      EXTRA_EXCLUDES=""
      if [ -n "${MKLROOT:-}" ]; then
        EXTRA_EXCLUDES="-x gbsv -x gbtrf -x gbtrs -x gbcon -x gbrfs"
      fi
      cd build/test && LD_LIBRARY_PATH=%{prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} python3 run_tests.py --quick -x hegvd -x hpgvd $EXTRA_EXCLUDES

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -llapackpp -lblaspp"
