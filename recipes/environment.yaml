name: environment
version: "2026"
release: 2
summary: SCLS environment setup, activation scripts, and configuration
license: BSD-3-Clause
bootstrap: true

# Host toolchain the installed stack needs at runtime. SCLS is a development
# stack (headers, .so, cmake/pkg-config files); users compile and link against
# it, so the compilers the stack was built with must be present on the
# consumer host. `AutoReqProv: no` (see CLAUDE.md) means nothing else pulls
# them in, and every other package Pre-Depends/Requires(pre) on environment,
# so this is the one place to state it. Names are RHEL package names; the
# deb builder translates them via packaging/system_packages.yaml.
#
#   lbl    builds its own gcc/binutils (scls-lbl-gcc via requires:), so the
#          host toolchain is not needed once the stack is installed.
#   intel  uses icx/ifx from Intel's oneAPI repo; there is no distro package
#          to name here. The install is documented as a host prerequisite.
rpm_requires:
  all:
    - make
  gcc:
    - gcc
    - gcc-c++
    - gcc-gfortran
    - glibc-devel
  mkl:
    - gcc
    - gcc-c++
    - gcc-gfortran
    - glibc-devel
  debug:
    - gcc
    - gcc-c++
    - gcc-gfortran
    - glibc-devel
  gcc-mkl-cuda:
    - gcc
    - gcc-c++
    - gcc-gfortran
    - glibc-devel
  lbl: []
  intel: []

# Weak dependencies (RPM Recommends: / Debian Recommends:). dnf and apt
# install these by default but do not fail when they are unavailable --
# doxygen lives in CRB on RHEL 9/10, which is disabled on a fresh host.
# Nothing in the stack invokes doxygen; it is a convenience for developers
# building documentation for their own projects against SCLS.
rpm_recommends:
  all:
    - doxygen

# This package has no external source - files are generated from templates
source:
  type: generated

update:
  strategy: skip
  reason: Generated package, no external source

configure:
  type: none

# No build step needed
build:
  skip: true

# Installation creates the activation scripts and config from templates
install:
  files:
    - src: README.md
      dest: share/doc/scls/README.md
    - src: LICENSE
      dest: share/doc/scls/LICENSE
  templates:
    - src: scls-config.yaml.j2
      dest: share/scls/config.yaml
    - src: scls-activate.sh.j2
      dest: share/scls/activate
      mode: "0755"
    - src: scls-activate.sh.j2
      dest: share/scls/activate.sh
      mode: "0755"
    - src: scls-deactivate.sh.j2
      dest: share/scls/deactivate.sh
      mode: "0755"
    # Runtime scls command and subcommands
    - src: scls-bin.sh.j2
      dest: bin/scls
      mode: "0755"
    - src: scls-help.sh.j2
      dest: share/scls/scripts/scls-help
      mode: "0755"
    - src: scls-list.sh.j2
      dest: share/scls/scripts/scls-list
      mode: "0755"
    - src: scls-info.sh.j2
      dest: share/scls/scripts/scls-info
      mode: "0755"
    - src: scls-env.sh.j2
      dest: share/scls/scripts/scls-env
      mode: "0755"
    - src: scls-prefix.sh.j2
      dest: share/scls/scripts/scls-prefix
      mode: "0755"
    - src: scls-flavor.sh.j2
      dest: share/scls/scripts/scls-flavor
      mode: "0755"
    - src: scls-license.sh.j2
      dest: share/scls/scripts/scls-license
      mode: "0755"
    - src: scls-deactivate-cmd.sh.j2
      dest: share/scls/scripts/scls-deactivate
      mode: "0755"
