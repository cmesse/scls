name: ucx
version: 1.20.1
summary: Unified Communication X - high-performance communication framework
homepage: https://openucx.org
license: BSD

# UCX installs many platform-dependent files (transport plugins, arch-specific
# headers, cmake config, pkg-config files). Auto-generate %files from BUILDROOT.
rpm_files_auto: true

# Not built for macos (no InfiniBand)
exclude_flavors:
  - macos

source:
  url: https://github.com/openucx/ucx/releases/download/v%{version}/ucx-%{version}.tar.gz

update:
  strategy: github_release
  repo: openucx/ucx

requires: []

# UCX without explicit transport build deps would autodetect verbs/rdmacm
# and silently fall back to TCP-only on hosts where libibverbs-devel /
# librdmacm-devel aren't installed — producing a build-host-dependent
# binary. SCLS targets HPC, so we declare these as required and pass
# explicit --with-verbs / --with-rdmacm to make configure FAIL (rather
# than silently skip) if the headers are missing. Runtime deps mirror
# this so the installed package pulls in libibverbs/librdmacm — UCX
# loads transports via dlopen at runtime; missing libs would silently
# fall back to TCP at runtime too.
rpm_build_requires:
  all:
    - libibverbs-devel
    - librdmacm-devel

rpm_requires:
  all:
    - libibverbs
    - librdmacm

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  # GCC 16 warns that OpenMP `master` is deprecated since OpenMP 5.1.
  # UCX 1.20.0 still uses it in src/tools/perf/perftest.c, and UCX's
  # configure injects a broad -Werror into BASE_CFLAGS. Keep warnings as
  # errors generally, but do not fail on this compatibility warning.
  env:
    - CFLAGS: "+=-Wno-error=deprecated-openmp"
  args:
    - --enable-optimizations
    - --enable-mt
    - --enable-cma
    - --with-verbs
    - --with-rdmacm
    - --without-cuda
    - --without-rocm
    - --without-java
    - --without-go

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
