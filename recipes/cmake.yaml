name: cmake
version: 4.3.2
summary: Cross-platform make system
homepage: https://cmake.org/
license: BSD-3-Clause
bootstrap: true
source:
  url: https://github.com/Kitware/CMake/releases/download/v%{version}/cmake-%{version}.tar.gz

requires:
  macos:
    - automake
    - autoconf
    - openssl
    - sed

rpm_build_requires:
    - ncurses-devel
    - openssl-devel
    - zlib-devel      # --system-zlib requires libz headers on Linux

rpm_requires:
    - sed
    - git
    - ncurses
    - openssl
    - zlib

features:
  fortran: false
  mpi: false
  openmp: false
  math: false
configure:
  type: custom
  command: ./configure
  args:
    - '--prefix=%{prefix}'
    - '--no-qt-gui'
    - '--parallel=%{nprocs}'
    - '--system-zlib'
    - '--no-system-curl'
    - '--'
    - '-DCMAKE_USE_OPENSSL=OFF'
  optimization:
    O_level: 2
    strict_aliasing: true
  pre:
     - "sed -i '/\"lib64\"/s/64//' Modules/GNUInstallDirs.cmake"
  env:
    SED: "sed"
  flavor_env:
    macos:
      SED: "gsed"
      CFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      CXXFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      LDFLAGS: "+=-isysroot %{sdk}"

build:
  parallel: true
