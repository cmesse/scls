name: cmake
version: 4.2.1
summary: Cross-platform make system
homepage: https://cmake.org/
license: BSD-3-Clause
bootstrap: true
source:
  url: https://github.com/Kitware/CMake/releases/download/v%{version}/cmake-%{version}.tar.gz

requires:
  macos:
    - automake
    - autoconf
    - openssl
    - sed

rpm_build_requires:
    - ncurses-devel
    - openssl-devel

rpm_requires:
    - sed
    - git
    - ncurses
    - openssl

features:
  fortran: false
  mpi: false
  openmp: false
  math: false
configure:
  type: custom
  command: ./configure
  args:
    - '--prefix=%{prefix}'
    - '--no-qt-gui'
    - '--parallel=%{nprocs}'
    - '--system-zlib'
  optimization:
    O_level: 2
    strict_aliasing: true
  pre:
     - "sed -i '/\"lib64\"/s/64//' Modules/GNUInstallDirs.cmake"
  flavor_env:
    all:
      SED: "sed"
    macos:
      SED: "gsed"

build:
  parallel: true