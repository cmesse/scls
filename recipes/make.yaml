name: make
version: 4.4.1
description:  A GNU tool which simplifies the build process for users
homepage: http://www.gnu.org/software/make/
license: GPL-3.0-or-later AND LGPL-2.1-or-later AND GFDL-1.3-or-later AND FSFULLR
bootstrap: true  # Build with system Clang before GCC is available

source:
  url: https://ftp.gnu.org/gnu/make/make-%{version}.tar.gz

# Only build for these flavors
include_flavors:
  - macos

requires:
  - autoconf
  - automake

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true

  flavor_args:
    macos:
      - "--with-libiconv-prefix=%{sdk}/usr"
      - "--with-libintl-prefix=%{sdk}/usr"

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"