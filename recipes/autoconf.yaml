name: autoconf
version: 2.72
summary: A GNU tool for automatically configuring source code
homepage: https://www.gnu.org/software/autoconf/
license: GPL-2.0-or-later AND GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GFDL-1.3-or-later AND FSFAP AND X11 AND LicenseRef-Fedora-Public-Domain
bootstrap: true  # Build with system compiler before scls gcc is available

source:
  url: https://ftp.gnu.org/gnu/autoconf/autoconf-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires:
  - m4

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  flavor_env:
    macos:
      - M4: "%{prefix}/bin/m4"
build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"