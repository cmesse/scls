name: mlpack
version: 4.6.2
summary: A fast, flexible C++ machine learning library
homepage: https://www.mlpack.org/
license: BSD-3-Clause

# Niche; not part of the default distributions. Build via extra_packages in flavor.conf.
include_flavors: []

source:
  url: https://github.com/mlpack/mlpack/archive/refs/tags/%{version}.tar.gz

update:
  strategy: github_tag
  repo: mlpack/mlpack
  tag_prefix: ""  # upstream tags are bare N.N.N, no "v" prefix

requires:
  all:
    - cmake
    - armadillo
    - ensmallen
    - cereal

features:
  fortran: false
  mpi: false
  openmp: true
  math: serial

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DARMADILLO_LIBRARY=%{prefix}/lib/libarmadillo%{libext}"
    - "-DARMADILLO_INCLUDE_DIR=%{prefix}/include"
    - "-DENSMALLEN_INCLUDE_DIR=%{prefix}/include"
    - "-DCEREAL_INCLUDE_DIR=%{prefix}/include"
    # Skip heavy optional components
    - "-DBUILD_TESTS=ON"
    - "-DBUILD_CLI_EXECUTABLES=ON"
    - "-DBUILD_PYTHON_BINDINGS=OFF"
    - "-DBUILD_JULIA_BINDINGS=OFF"
    - "-DBUILD_GO_BINDINGS=OFF"
    - "-DBUILD_R_BINDINGS=OFF"
    - "-DBUILD_MARKDOWN_BINDINGS=OFF"
    - "-DDOWNLOAD_DEPENDENCIES=OFF"
  optimization:
    O_level: 3

build:
  parallel: true

test:
  commands:
    - "cd build && ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lmlpack"
