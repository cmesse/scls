name: strumpack
version: 8.0.0
summary: STRUctured Matrix PACKage - sparse and dense rank-structured linear solvers
homepage: https://portal.nersc.gov/project/sparse/strumpack
license: BSD-3-Clause

source:
  url: https://github.com/pghysels/STRUMPACK/archive/v%{version}.tar.gz

patches:
  all:
    - strumpack_bpack_inttype.patch

requires:
  all:
    - cmake
    - openmpi
    - metis
    - parmetis
    - scotch
    - zfp
    - butterflypack
  cuda:
    - slate

features:
  fortran: true
  mpi: true
  openmp: true
  math: parallel

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_TESTING=ON"
    - "-DSTRUMPACK_USE_MPI=ON"
    - "-DSTRUMPACK_USE_HIP=OFF"
    - "-DSTRUMPACK_USE_SYCL=OFF"
    - "-DTPL_ENABLE_BPACK=ON"
    - "-DTPL_ENABLE_PARMETIS=ON"
    - "-DTPL_ENABLE_SCOTCH=ON"
    - "-DTPL_ENABLE_PTSCOTCH=ON"
    - "-DTPL_ENABLE_ZFP=ON"
  # LP64/ILP64 integer interface
  lp64_args:
    - "-DSTRUMPACK_USE_BLAS64=OFF"
  ilp64_args:
    - "-DSTRUMPACK_USE_BLAS64=ON"
  flavor_args:
    macos:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      - "-DTPL_BLAS_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
      - "-DTPL_LAPACK_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.dylib"
    debug:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      - "-DTPL_BLAS_LIBRARIES=%{prefix}/lib/libblas.so"
      - "-DTPL_LAPACK_LIBRARIES=%{prefix}/lib/liblapack.so"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
    gcc:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      - "-DTPL_BLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DTPL_LAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
    lbl:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      - "-DTPL_BLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DTPL_LAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
    mkl:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      # Serial MKL for BLAS/LAPACK; stack-owned ScaLAPACK for the parallel slot.
      - "-DTPL_BLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_LAPACK_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
    intel:
      - "-DSTRUMPACK_USE_CUDA=OFF"
      - "-DTPL_ENABLE_SLATE=OFF"
      - "-DTPL_BLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_LAPACK_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
    cuda:
      - "-DSTRUMPACK_USE_CUDA=ON"
      - "-DTPL_ENABLE_SLATE=ON"
      - "-Dblaspp_DIR=%{prefix}/lib/cmake/blaspp"
      - "-Dlapackpp_DIR=%{prefix}/lib/cmake/lapackpp"
      - "-Dslate_DIR=%{prefix}/lib/cmake/slate"
      - "-DCMAKE_CUDA_ARCHITECTURES=%{cuda_architectures}"
      - "-DTPL_BLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_LAPACK_LIBRARIES=%{mkl_linker_flags}"
      - "-DTPL_SCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so"
  optimization:
    O_level: 3

build:
  parallel: true
  in_source: false

test:
  sources:
    - url: https://suitesparse-collection-website.herokuapp.com/MM/TOKAMAK/utm300.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/Pothen/mesh3e1.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/Oberwolfach/t2dal.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/HB/bcsstk28.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/DRIVCAV/cavity16.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/HB/bcsstm08.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/HB/sherman4.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/Bai/rdb968.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/CPM/cz10228.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/TKK/cbuckle.tar.gz
    - url: https://suitesparse-collection-website.herokuapp.com/MM/HB/gemat11.tar.gz
  commands:
    # All excluded tests are tight-tolerance (~1e-10 abs_tol) low-rank
    # compression cases (HSS / BLR / HODLR). At that tolerance the
    # compression makes discrete rank decisions via an SVD cutoff, so a
    # ~1e-15 difference in a GEMM output (FMA vs no-FMA, summation order,
    # accumulation width) can flip which singular values cross the
    # threshold, change the compressed operator, and overshoot upstream's
    # "RESIDUAL TOO LARGE" guard. The cliff is bidirectional: reference
    # LAPACK + debug's -fno-fast-math and MKL trip different (test,
    # matrix, ordering) combos, which is why the exclusion set has grown
    # as flavors were added. Not a regression — upstream CI runs a single
    # BLAS and doesn't see the full cliff.
    # Amazon Linux's libgomp + OpenBLAS combo trips a numerical
    # divergence in user_test_sparse_seq's second solve when nested
    # OpenMP is on (factorization comes back with an effectively
    # singular preconditioner). Rocky/RHEL doesn't see this with the
    # same OpenBLAS version, so we scope the workaround to Amazon
    # Linux only via /etc/os-release ID detection.
    - "if grep -q '^ID=\"\\?amzn\"\\?' /etc/os-release 2>/dev/null; then export OMP_NESTED=false; fi && export PRTE_MCA_rmaps_default_mapping_policy=:oversubscribe && cd build && ctest --output-on-failure -E '(SPARSE_HODLR_mpi_1|SPARSE_mpi_16$|SPARSE_seq_77$|SPARSE_mpi_2$|user_test_HSS_mpi$|HSS_mpi_13$|SPARSE_seq_74$|SPARSE_seq_scotch_3$|SPARSE_HSS_mpi_1$)'"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lstrumpack"
