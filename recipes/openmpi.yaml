name: openmpi
version: 5.0.9
summary: A powerful implementation of MPI/SHMEM
homepage: https://www.open-mpi.org
license: BSD

# OpenMPI installs hundreds of platform-dependent files (MCA modules, OSHMEM,
# etc.) that vary across versions and OS. Auto-generate %files from BUILDROOT.
rpm_files_auto: true

source:
  url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-%{version}.tar.bz2

# Flavor-specific version overrides
# OpenMPI 5.x requires PMIx >= 4.2.0, but the LBL HPC has system PMIx 4.1.3.
# Use OpenMPI 4.1.6 for the lbl flavor to maintain Slurm compatibility.
flavor_overrides:
  lbl:
    version: 4.1.6
    source:
      url: https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-%{version}.tar.bz2

requires:
  all:
    - gmp
    - mpfr
    - mpc
  gcc:
    - pmix
    - libevent
    - hwloc
  mkl:
    - pmix
    - libevent
    - hwloc
  lbl: []  # uses system pmix, hwloc, libevent
  macos:
    - gcc
    - pmix
    - libevent
    - hwloc
features:
  fortran: yes
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  defaults:
    host_flags: false
  env:
    - CFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - CXXFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - FCFLAGS: "+=-DHAVE_UNIX_BYTESWAP"

  args:
    - --enable-mpi-fortran
    - --enable-mpi1-compatibility
  flavor_args:
    gcc:
      - --with-pmix=%{prefix}
      - --with-hwloc=%{prefix}
      - --with-hwloc-libdir=%{prefix}/lib
      - --with-libevent=%{prefix}
      - --with-libevent-libdir=%{prefix}/lib
    mkl:
      # mkl flavor uses our own pmix/hwloc/libevent (same as gcc); MKL only
      # affects math libs, not the MPI stack.
      - --with-pmix=%{prefix}
      - --with-hwloc=%{prefix}
      - --with-hwloc-libdir=%{prefix}/lib
      - --with-libevent=%{prefix}
      - --with-libevent-libdir=%{prefix}/lib
    lbl:
      - --with-slurm
      - --with-pmix=external
      - --with-hwloc=external
      - --with-libevent=external
      - --with-ucx
    gcc-mkl-cuda:
      - --enable-mpi-ext=cuda
      - --with-cuda=%{cuda}
      - --with-cuda-libdir=%{cuda}/lib64
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
