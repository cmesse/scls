name: openmpi
version: 5.0.10
release: 3
summary: A powerful implementation of MPI/SHMEM
homepage: https://www.open-mpi.org
license: BSD

# OpenMPI installs hundreds of platform-dependent files (MCA modules, OSHMEM,
# etc.) that vary across versions and OS. Auto-generate %files from BUILDROOT.
rpm_files_auto: true

source:
  # The vX.Y directory is the release series, not the full version, so it has to
  # be bumped together with version: above -- there is no major.minor macro. The
  # same trap silently 404'd hwloc and vtk during the 2026-08 upgrade.
  url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-%{version}.tar.bz2

# GCC 16's inliner treats __opal_attribute_always_inline__ as mandatory and
# exhausts its budget on this request-start helper, turning a soft hint into
# a hard compile error. Dropping the forced attribute leaves the function
# `static inline`, so older GCC still inlines it via normal heuristics and
# behavior is unchanged. Apply across every 5.0.10 flavor so a future Linux
# host with GCC >= 16 (gcc_toolset:16, Fedora 43+, etc.) doesn't hit the same
# wall. lbl is excluded because it pins OpenMPI to 4.1.6, which predates the
# MPI-4 persist part component the patch touches; the empty list short-circuits
# the `gcc:` key that lbl would otherwise inherit.
patches:
  gcc:
    - openmpi-5.0.10-part-persist-drop-forced-inline.patch
  mkl:
    - openmpi-5.0.10-part-persist-drop-forced-inline.patch
  debug:
    - openmpi-5.0.10-part-persist-drop-forced-inline.patch
  intel:
    - openmpi-5.0.10-part-persist-drop-forced-inline.patch
  macos:
    - openmpi-5.0.10-part-persist-drop-forced-inline.patch
  lbl:
    - openmpi-4.1.6-memheap-zero-init.patch

update:
  strategy: github_tag
  repo: open-mpi/ompi
  tag_prefix: "v"

# Flavor-specific version overrides
# OpenMPI 5.x requires PMIx >= 4.2.0, but the LBL HPC has system PMIx 4.1.3.
# Use OpenMPI 4.1.6 for the lbl flavor to maintain Slurm compatibility.
flavor_overrides:
  lbl:
    version: 4.1.6
    source:
      # Series directory again -- keep v4.1 in step with the 4.1.x version above.
      url: https://download.open-mpi.org/release/open-mpi/v4.1/openmpi-%{version}.tar.bz2

requires:
  gcc:
    - pmix
    - libevent
    - hwloc
    - ucx
  mkl:
    - pmix
    - libevent
    - hwloc
    - ucx
  debug:
    - pmix
    - libevent
    - hwloc
    - ucx
  lbl:
    - ucx
  macos:
    - gcc
    - pmix
    - libevent
    - hwloc

# Build-host packages probed at configure time. Without these declared,
# OpenMPI's autotools configure can silently disable Slurm support or
# fall back to bundled implementations when system headers/libs aren't
# present — making the produced binary depend on what the build host
# happens to have installed. lbl uses --with-X=external for these, so
# they must be the system packages, not SCLS stack deps.
#
# flex is required by every flavor: PRRTE's src/util/hostfile and
# src/mca/rmaps/rank_file scanners are lex sources. The tarball ships
# pre-generated *.c alongside the *.l, but automake's LEX rule fires
# whenever a stray mtime makes the .l look newer than the .c, and with
# LEX=: (the no-op fallback used when flex is absent) the regenerated .c
# lands empty. Downstream, PRRTE's tools (prte/prterun/prted/pterm) fail
# to link one of the frameworks that pulls those scanners in, `make
# install` silently skips src/tools/, and the resulting openmpi package
# has libmpi but no runtime launcher.
rpm_build_requires:
  all:
    - flex
  lbl:
    - slurm-devel
    - pmix-devel
    - hwloc-devel
    - libevent-devel

features:
  fortran: yes
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  defaults:
    host_flags: false
  env:
    - CFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - CXXFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - FCFLAGS: "+=-DHAVE_UNIX_BYTESWAP"

  args:
    - --enable-mpi-fortran
    - --enable-mpi1-compatibility
  flavor_args:
    gcc:
      - --with-pmix=%{prefix}
      - --with-hwloc=%{prefix}
      - --with-hwloc-libdir=%{prefix}/lib
      - --with-libevent=%{prefix}
      - --with-libevent-libdir=%{prefix}/lib
      - --with-ucx=%{prefix}
    mkl:
      # mkl flavor uses our own pmix/hwloc/libevent (same as gcc); MKL only
      # affects math libs, not the MPI stack.
      - --with-pmix=%{prefix}
      - --with-hwloc=%{prefix}
      - --with-hwloc-libdir=%{prefix}/lib
      - --with-libevent=%{prefix}
      - --with-libevent-libdir=%{prefix}/lib
      - --with-ucx=%{prefix}
    debug:
      - --with-pmix=%{prefix}
      - --with-hwloc=%{prefix}
      - --with-hwloc-libdir=%{prefix}/lib
      - --with-libevent=%{prefix}
      - --with-libevent-libdir=%{prefix}/lib
      - --with-ucx=%{prefix}
    lbl:
      # OpenMPI 4.x: disable legacy OpenFabrics/verbs BTL; RDMA goes via UCX.
      # (Removed in OpenMPI 5.x, so only applicable here.)
      - --with-slurm
      - --with-pmix=external
      - --with-hwloc=external
      - --with-libevent=external
      - --with-ucx=%{prefix}
      - --without-verbs
    gcc-mkl-cuda:
      - --enable-mpi-ext=cuda
      - --with-cuda=%{cuda}
      - --with-cuda-libdir=%{cuda}/lib64
  # Post-configure validation. OpenMPI's configure can succeed without
  # actually compiling in CUDA support if the --with-cuda path layout
  # doesn't match what's expected (different CUDA versions ship lib in
  # different subdirs). Validate the generated opal_config.h instead of
  # trusting configure exit code — fails loudly with a clear message.
  flavor_post:
    gcc-mkl-cuda:
      - "grep -q '#define OPAL_CUDA_SUPPORT 1' opal/include/opal_config.h || { echo 'ERROR: CUDA MPI support missing despite --enable-mpi-ext=cuda --with-cuda=%{cuda}; check that %{cuda}/lib64 contains libcudart and that opal/include/opal_config.h was regenerated cleanly.'; exit 1; }"
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
