name: slepc
version: 3.24.3
summary: Scalable Library for Eigenvalue Problem Computations
homepage: https://slepc.upv.es/
license: BSD-2-Clause

source:
  url: https://slepc.upv.es/download/distrib/slepc-%{version}.tar.gz

requires:
  all:
    - petsc
    - arpack-ng
    - scalapack

features:
  fortran: true
  mpi: true
  openmp: true
  math: parallel

configure:
  type: custom
  command: ./configure
  skip_compiler_env: true
  # SLEPc needs PETSC_DIR set in environment
  env:
    PETSC_DIR: "%{prefix}"
  args:
    - "--prefix=%{prefix}"
    # Use our ARPACK
    - "--with-arpack-dir=%{prefix}"
    # ScaLAPACK from PETSc
    - "--with-scalapack=1"
  flavor_args:
    macos:
      []
    debug:
      []
    mkl:
      # FEAST requires MKL
      - "--with-feast=1"
    intel:
      - "--with-feast=1"
  optimization:
    O_level: 2

# SLEPc needs PETSC_DIR and SLEPC_DIR during build
build:
  parallel: true
  args:
    - "SLEPC_DIR=%{srcdir}"
    - "PETSC_DIR=%{prefix}"

install:
  args:
    - "SLEPC_DIR=%{srcdir}"
    - "PETSC_DIR=%{prefix}"

# SLEPc tests cannot run during %check for the same reason as PETSc:
# SlepcInitialize_DynamicLibraries() dlopens plugins from the hardcoded install
# prefix /opt/scls/gcc/lib, but during %check those files only exist in
# %{buildroot}/opt/scls/gcc/lib, and SLEPc's loader ignores LD_LIBRARY_PATH for
# the plugin lookup. Tests can be run by users post-install.

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lslepc"
