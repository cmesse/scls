name: libtool
version: 2.5.4
summary: The GNU Portable Library Tool
homepage: https://www.gnu.org/software/libtool
license: GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-2.0-or-later WITH Libtool-exception AND LGPL-2.0-or-later WITH Libtool-exception AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND MIT AND FSFAP AND FSFULLR AND FSFULLRWD AND GFDL-1.3-or-later AND X11 AND LicenseRef-Fedora-public-domain
bootstrap: true  # Build with system Clang before GCC is available

source:
  url: http://ftp.gnu.org/gnu/libtool/libtool-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires:
  - autoconf
  - automake

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  args:
    - "--disable-silent-rules"

build:
  parallel: false

install:
  post:
    - "rm -vf %{prefix}/lib/libltdl.a"

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"