name: vtk
version: 9.7.0
summary: A high-level 3D visualization library
homepage: https://vtk.org/
license: BSD-3-Clause

source:
  # The X.Y directory is the release series, not the full version, so it has
  # to be bumped together with version: above. There is no major.minor macro.
  url: https://vtk.org/files/release/9.7/VTK-%{version}.tar.gz
  directory: VTK-%{version}

update:
  strategy: gitlab
  instance: https://gitlab.kitware.com
  repo: vtk/vtk
  tag_prefix: "v"

requires:
  all:
    - cmake
  # The macOS flags below are probed from the SCLS GCC (%{gcc_version},
  # %{gcc_machine}), so gcc must be installed first on that flavor.
  macos:
    - gcc

features:
  fortran: false
  mpi: false
  openmp: true
  math: false

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DVTK_BUILD_DOCUMENTATION=OFF"
    - "-DVTK_BUILD_EXAMPLES=OFF"
    - "-DVTK_BUILD_SCALED_SOA_ARRAYS=OFF"
    - "-DVTK_BUILD_SPHINX_DOCUMENTATION=OFF"
    - "-DVTK_BUILD_TESTING=OFF"
    - "-DVTK_USE_MPI=OFF"
    - "-DVTK_WRAP_JAVA=OFF"
    - "-DVTK_WRAP_PYTHON=OFF"
  flavor_args:
    gcc:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    lbl:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    macos:
      - "-DVTK_USE_COCOA=ON"
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_USE_X=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=Sequential"
      - "-DVTK_SMP_ENABLE_STDTHREAD=OFF"
      # VTK is deliberately compiled with Apple clang (/usr/bin/gcc IS clang)
      # but against the SCLS GCC libstdc++: -nostdinc++ hides clang's own C++
      # headers and the -isystem paths point at GCC's. Those directories are
      # named by the installed GCC's full version and configured target
      # (include/c++/16.2.0/aarch64-apple-darwin25.2.0 on Apple Silicon), so
      # they are probed from %{prefix}/bin/g++ (-dumpfullversion, -dumpmachine)
      # at configure time via %{gcc_version}/%{gcc_machine} -- see
      # gcc_identity() in python/build_common.py -- rather than hardcoded.
      - "-DCMAKE_C_COMPILER=/usr/bin/gcc"
      - "-DCMAKE_CXX_COMPILER=/usr/bin/g++"
      - "-DCMAKE_CXX_FLAGS=-stdlib=libstdc++ -femulated-tls -nostdinc++ -isystem %{prefix}/include/c++/%{gcc_version} -isystem %{prefix}/include/c++/%{gcc_version}/%{gcc_machine} -isystem %{prefix}/include/c++/%{gcc_version}/backward"
      - "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DCMAKE_MODULE_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DVTK_REQUIRED_OBJCXX_FLAGS=-stdlib=libstdc++ -femulated-tls -nostdinc++ -isystem %{prefix}/include/c++/%{gcc_version} -isystem %{prefix}/include/c++/%{gcc_version}/%{gcc_machine} -isystem %{prefix}/include/c++/%{gcc_version}/backward"
    debug:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    cuda:
      - "-DVTK_USE_CUDA=ON"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
      - "-DCMAKE_CUDA_ARCHITECTURES=%{cuda_architectures}"
  optimization:
    O_level: 2

build:
  parallel: true

rpm_build_requires:
  - libXcursor-devel
  - libXext-devel

rpm_files_auto: true

registry:
  # Release series (X.Y), not the full version: bump together with version:.
  cflags: "-I%{prefix}/include/vtk-9.7"
  ldflags: "-L%{prefix}/lib -lvtkCommonCore -lvtkCommonDataModel -lvtkIOCore"
