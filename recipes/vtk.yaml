name: vtk
version: 9.6.2
summary: A high-level 3D visualization library
homepage: https://vtk.org/
license: BSD-3-Clause

source:
  url: https://vtk.org/files/release/9.6/VTK-%{version}.tar.gz

update:
  strategy: gitlab
  instance: https://gitlab.kitware.com
  repo: vtk/vtk
  tag_prefix: "v"

requires:
  all:
    - cmake

features:
  fortran: false
  mpi: false
  openmp: true
  math: false

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DVTK_BUILD_DOCUMENTATION=OFF"
    - "-DVTK_BUILD_EXAMPLES=OFF"
    - "-DVTK_BUILD_SCALED_SOA_ARRAYS=OFF"
    - "-DVTK_BUILD_SPHINX_DOCUMENTATION=OFF"
    - "-DVTK_BUILD_TESTING=OFF"
    - "-DVTK_USE_MPI=OFF"
    - "-DVTK_WRAP_JAVA=OFF"
    - "-DVTK_WRAP_PYTHON=OFF"
  flavor_args:
    gcc:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    lbl:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    macos:
      - "-DVTK_USE_COCOA=ON"
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_USE_X=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=Sequential"
      - "-DVTK_SMP_ENABLE_STDTHREAD=OFF"
      - "-DCMAKE_C_COMPILER=/usr/bin/gcc"
      - "-DCMAKE_CXX_COMPILER=/usr/bin/g++"
      - "-DCMAKE_CXX_FLAGS=-stdlib=libstdc++ -femulated-tls -nostdinc++ -isystem %{prefix}/include/c++/16.1.0 -isystem %{prefix}/include/c++/16.1.0/x86_64-apple-darwin24.6.0 -isystem %{prefix}/include/c++/16.1.0/backward"
      - "-DCMAKE_EXE_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DCMAKE_MODULE_LINKER_FLAGS=-stdlib=libstdc++ -L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -Wl,-headerpad_max_install_names"
      - "-DVTK_REQUIRED_OBJCXX_FLAGS=-stdlib=libstdc++ -femulated-tls -nostdinc++ -isystem %{prefix}/include/c++/16.1.0 -isystem %{prefix}/include/c++/16.1.0/x86_64-apple-darwin24.6.0 -isystem %{prefix}/include/c++/16.1.0/backward"
    debug:
      - "-DVTK_USE_CUDA=OFF"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
    cuda:
      - "-DVTK_USE_CUDA=ON"
      - "-DVTK_SMP_IMPLEMENTATION_TYPE=OpenMP"
      - "-DCMAKE_CUDA_ARCHITECTURES=%{cuda_architectures}"
  optimization:
    O_level: 2

build:
  parallel: true

rpm_build_requires:
  - libXcursor-devel
  - libXext-devel

rpm_files_auto: true

registry:
  cflags: "-I%{prefix}/include/vtk-9.6"
  ldflags: "-L%{prefix}/lib -lvtkCommonCore -lvtkCommonDataModel -lvtkIOCore"
