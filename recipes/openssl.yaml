name: openssl
version: 3.6.2
summary: The OpenSSL cryptography and TLS library
homepage: https://www.openssl.org/
license: Apache 2.0
bootstrap: true

source:
  url: https://github.com/openssl/openssl/releases/download/openssl-%{version}/openssl-%{version}.tar.gz

update:
  # Pin to the 3.x line — openssl 4 is a major API/ABI change; downstream
  # consumers (cmake, curl-using tools) need to be re-validated first.
  max_major: 3

include_flavors:
  - macos

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: custom
  command: ./Configure
  flavor_env:
    macos:
      CFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      CXXFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      LDFLAGS: "+=-isysroot %{sdk}"
  args:
    - "--prefix=%{prefix}"
    - "--libdir=%{prefix}/lib"
    - shared
    - zlib-dynamic
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

install:
  post:
    # Remove all static libraries - we only want shared libs
    - "rm -vf %{prefix}/lib/*.a"

test:
  commands:
    - "HARNESS_JOBS=%{nprocs} make test 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(ok|fail|skipped|error):' check.log || echo 'No test results found'"
