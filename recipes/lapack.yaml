name: lapack
version: 3.12.1
summary: LAPACK - Linear Algebra PACKage
homepage: https://www.netlib.org/lapack/
license: BSD-3-Clause

source:
  url: https://github.com/Reference-LAPACK/lapack/archive/v%{version}/lapack-%{version}.tar.gz

# Only build for debug flavor (reference BLAS/LAPACK)
# gcc/lbl and macos use OpenBLAS which bundles LAPACK
flavors:
  - debug

requires:
  all:
    - cmake
  macos:
    - gcc
    - openblas
  debug:
    - gcc

features:
  fortran: true
  mpi: false
  openmp: false
  math: false

# Subpackages: blas and cblas only built for debug flavor
# lapack and lapacke built for all flavors
subpackages:
  blas:
    summary: The Basic Linear Algebra Subprograms library (reference)
    flavors:
      - debug
    files:
      - "lib/libblas.so*"
      - "lib/pkgconfig/blas.pc"

  cblas:
    summary: C interface to BLAS
    description: |
      CBLAS provides a C interface to the Basic Linear Algebra Subprograms.
    flavors:
      - debug
    requires:
      - blas
    files:
      - "include/cblas*.h"
      - "lib/libcblas.so*"
      - "lib/pkgconfig/cblas.pc"
      - "lib/cmake/cblas-*/*"

  lapack:
    summary: LAPACK numerical linear algebra library
    requires:
      debug:
        - blas
      macos:
        - openblas
    files:
      - "lib/liblapack.so*"
      - "lib/libtmglib.so*"
      - "lib/pkgconfig/lapack.pc"
      - "lib/cmake/lapack-*/*"

  lapacke:
    summary: C interface to LAPACK
    requires:
      - lapack
    files:
      - "include/lapack*.h"
      - "lib/liblapacke.so*"
      - "lib/pkgconfig/lapacke.pc"
      - "lib/cmake/lapacke-*/*"

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DLAPACKE=ON"
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    # XBLAS for extended precision
    - "-DXBLAS=OFF"
    # Fortran compiler flags: -O3 is safe for LAPACK, -frecursive for recursive routines
    - "-DCMAKE_Fortran_FLAGS=-O3 -frecursive"
  flavor_args:
    debug:
      # Build BLAS and CBLAS for debug flavor (blaspp/lapackpp are separate packages)
      - "-DCBLAS=ON"
      - "-DUSE_OPTIMIZED_BLAS=OFF"
    macos:
      # Use OpenBLAS, don't build reference BLAS/CBLAS
      - "-DCBLAS=OFF"
      - "-DUSE_OPTIMIZED_BLAS=ON"
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
    mkl:
      # MKL flavor - typically wouldn't use this recipe
      - "-DCBLAS=OFF"
      - "-DUSE_OPTIMIZED_BLAS=ON"
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  lp64_args:
    - "-DBUILD_INDEX64=OFF"
    - "-DBUILD_INDEX64_EXT_API=OFF"
  ilp64_args:
    - "-DBUILD_INDEX64=ON"
    - "-DBUILD_INDEX64_EXT_API=OFF"

build:
  parallel: true

test:
  commands:
    - "ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -llapack -llapacke"
