name: lapack
version: 3.12.1
release: 2
summary: LAPACK - Linear Algebra PACKage
homepage: https://www.netlib.org/lapack/
license: BSD-3-Clause

source:
  url: https://github.com/Reference-LAPACK/lapack/archive/v%{version}/lapack-%{version}.tar.gz

# Only build for debug flavor (reference BLAS/LAPACK)
# gcc/lbl and macos use OpenBLAS which bundles LAPACK
include_flavors:
  - debug

requires:
  all:
    - cmake

features:
  fortran: true
  mpi: false
  openmp: false
  math: false

# Subpackages: blas, cblas, lapack, and lapacke (all debug-only)
subpackages:
  blas:
    summary: The Basic Linear Algebra Subprograms library (reference)
    include_flavors:
      - debug
    files:
      - "lib/libblas.so*"
      - "lib/pkgconfig/blas.pc"

  cblas:
    summary: C interface to BLAS
    description: |
      CBLAS provides a C interface to the Basic Linear Algebra Subprograms.
    include_flavors:
      - debug
    requires:
      - blas
    files:
      - "include/cblas*.h"
      - "lib/libcblas.so*"
      - "lib/pkgconfig/cblas.pc"
      - "lib/cmake/cblas-*/*"

  lapack:
    summary: LAPACK numerical linear algebra library
    requires:
      debug:
        - blas
    files:
      - "lib/liblapack.so*"
      - "lib/libtmglib.so*"
      - "lib/pkgconfig/lapack.pc"
      - "lib/cmake/lapack-*/*"

  lapacke:
    summary: C interface to LAPACK
    requires:
      - lapack
    files:
      - "include/lapack*.h"
      - "lib/liblapacke.so*"
      - "lib/pkgconfig/lapacke.pc"
      - "lib/cmake/lapacke-*/*"

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DLAPACKE=ON"
    - "-DBUILD_TESTING=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    # XBLAS for extended precision
    - "-DXBLAS=OFF"
    # -frecursive is needed for LAPACK's recursive routines
    #
    # -ffp-contract=off works around a gfortran 15.2 wrong-code bug (approved
    # by Christian 2026-09-26, jury-reviewed under /build-fix-jury). With
    # -O2 and the debug flavor's -march=x86-64-v3 (FMA), the SLP vectorizer
    # turns the complex update at zlaqr5.f:450 (DO 40, `H(K+1,J) - REFSUM*T1`)
    # into vfmaddsub/vfmsubadd code that computes the wrong result: a
    # multishift QR sweep stops being a similarity, and ZGEEV/CGEEV return
    # wrong eigenvectors for 76 <= n < 150 (lapackpp `tester geev`, residual
    # ~3e-3). LAPACK's own ctest does not catch it. The same lapack 3.12.1
    # built with GCC 13 (U24) passes. Without FMA contraction the vectorizer
    # cannot form that pattern (zlaqr5: 55 vfmadd* -> 0, measured with this
    # flag placed before upstream's appended -O2, which does not re-enable
    # contraction). claqr5.f is the CGEEV twin and gets the same flag.
    # OpenBLAS sidesteps the same code in its bundled LAPACK with
    # -fno-tree-vectorize for gfortran (OpenBLAS 0.3.34 Makefile:318-319).
    # Reproducer, measurements and gate results are in the devlog below.
    # Record: devlog/dl20260926_u26_lapack_gfortran15_zlaqr5.md.
    - "-DCMAKE_Fortran_FLAGS=%{fcflags} -frecursive -ffp-contract=off"
  flavor_args:
    debug:
      # Build BLAS and CBLAS for debug flavor (blaspp/lapackpp are separate packages)
      - "-DCBLAS=ON"
      - "-DUSE_OPTIMIZED_BLAS=OFF"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  lp64_args:
    - "-DBUILD_INDEX64=OFF"
    - "-DBUILD_INDEX64_EXT_API=OFF"
  ilp64_args:
    - "-DBUILD_INDEX64=ON"
    - "-DBUILD_INDEX64_EXT_API=OFF"

build:
  parallel: true

test:
  commands:
    - "cd build && ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -llapack -llapacke"
