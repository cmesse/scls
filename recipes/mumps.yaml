name: mumps
version: 5.8.2
summary: A MUltifrontal Massively Parallel sparse direct Solver
homepage: https://mumps-solver.org
license: CeCILL-C

source:
  url: https://mumps-solver.org/MUMPS_%{version}.tar.gz

update:
  strategy: html_regex
  url: https://mumps-solver.org/index.php
  # Latest release link on the main page: <a href="...">X.Y.Z</a>
  pattern: 'page=dwnld">(\d+\.\d+\.\d+)</a>'

requires:
  all:
    - openmpi
    - metis
    - parmetis
    - scotch

features:
  fortran: true
  mpi: true
  openmp: true
  math: parallel

# MUMPS uses a custom Makefile.inc - we use a Jinja2 template
configure:
  type: custom_makefile
  template: mumps/Makefile.inc.j2
  optimization:
    O_level: 3
  env:
    # MUMPS calls MPI routines with mismatched argument types (REAL/INTEGER);
    # GCC 10+ rejects this without -fallow-argument-mismatch
    FFLAGS: "+=-fallow-argument-mismatch"
    FCFLAGS: "+=-fallow-argument-mismatch"

build:
  parallel: true
  pre:
    # Build PORD library first (separate from main MUMPS build for shared libs)
    # Each command runs in a subshell so cd does not leak into the next line
    - "(cd PORD/lib && for f in *.c; do %{mpicc} %{cflags} -fopenmp -I../include -c $f; done)"
  # LP64/ILP64 PORD integer defines
  lp64_pre:
    - "(cd PORD/lib && %{mpicc} -shared -o ../../lib/libpord%{libext} *.o)"
  ilp64_pre:
    - "(cd PORD/lib && rm -f *.o && for f in *.c; do %{mpicc} %{cflags} -fopenmp -DPORD_INTSIZE64 -I../include -c $f; done)"
    - "(cd PORD/lib && %{mpicc} -shared -o ../../lib/libpord%{libext} *.o)"
  dir: src

install:
  commands:
    - "mkdir -p %{buildroot}%{prefix}/lib"
    - "mkdir -p %{buildroot}%{prefix}/include"
    - "install -m 755 lib/lib*%{libext} %{buildroot}%{prefix}/lib/"
    - "install -m 644 include/*.h %{buildroot}%{prefix}/include/"
    # Bundle CeCILL-C license text; upstream ships `LICENSE` at source root.
    # Avoid `install -D` — BSD install (macOS) interprets it differently.
    - "mkdir -p %{buildroot}%{prefix}/share/licenses/mumps"
    - "install -m 644 %{srcdir}/LICENSE %{buildroot}%{prefix}/share/licenses/mumps/LICENSE"

test:
  commands:
    # MUMPS examples are built by default — run dsimpletest (expected solution: 1,2,3,4,5)
    - "cd examples && LD_LIBRARY_PATH=$PWD/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} mpirun --allow-run-as-root -np 2 ./dsimpletest < input_simpletest_real 2>&1 | tee mumps_test.log && grep -q 'Solution is' mumps_test.log && echo 'PASS: MUMPS dsimpletest'"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -ldmumps -lmumps_common -lpord"
