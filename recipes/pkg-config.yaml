name: pkg-config
version: 0.29.2
summary: Package compiler and linker metadata toolkit
homepage: https://pkgconfig.freedesktop.org/
license: GPL 2.0
bootstrap: true  # Build with system compiler before scls gcc is available

source:
  url: https://pkgconfig.freedesktop.org/releases/pkg-config-%{version}.tar.gz

update:
  strategy: html_regex
  url: https://pkgconfig.freedesktop.org/releases/
  pattern: 'pkg-config-(\d+\.\d+\.\d+)\.tar\.gz'

# Only build for these flavors
include_flavors:
  - macos

requires:
  - autoconf
  - automake
  - libtool

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  env:
    CFLAGS : "+=-Wno-int-conversion"
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  args:
      - --with-internal-glib
      - --disable-host-tool
build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"