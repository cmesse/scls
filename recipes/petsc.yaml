name: petsc
version: 3.25.4

summary: Portable Extensible Toolkit for Scientific Computation
homepage: https://petsc.org/
license: BSD-2-Clause

source:
  url: https://web.cels.anl.gov/projects/petsc/download/release-snapshots/petsc-%{version}.tar.gz

# Upstream PETSc 3.25.0: BAIJMKL sources compile under PETSC_HAVE_MKL_SPARSE_OPTIMIZE,
# but their declarations in petscmat.h sit under PETSC_HAVE_MKL_SPARSE (legacy
# mkl_dcsrmv). MKL 2025+ on RHEL 10 dropped mkl_dcsrmv, so the auto-generated
# Fortran wrappers see no declarations and GCC 14 promotes the implicit-decl
# warning to an error. The patch is a header-only fix and is a no-op on
# non-MKL flavors (neither macro is defined there).
patches:
  all:
    - petsc-baijmkl-decls.patch

update:
  strategy: gitlab
  instance: https://gitlab.com
  repo: petsc/petsc
  tag_prefix: "v"

requires:
  all:
    # Build tools
    - cmake
    # MPI
    - openmpi
    # Partitioners
    - metis
    - parmetis
    - scotch
    # Direct solvers
    - superlu
    - superlu_dist
    - mumps
    - strumpack
    # I/O libraries
    - hdf5
    - netcdf
    - zfp
    # Infrastructure
    - googletest
  gcc:
    - hwloc
  lbl:  # uses system hwloc; gmp/mpfr built in-stack on LBL
    - gmp
    - mpfr
  macos:
    - hwloc
    - gmp
    - mpfr

# System gmp/mpfr on mainline Linux flavors (LGPL-3 not redistributed by SCLS).
# lbl builds its own gmp/mpfr in-stack; it inherits from `gcc`, so we must
# override with an explicit empty list to suppress the system -devel deps.
rpm_build_requires:
  lbl: []
  gcc:
    - gmp-devel
    - mpfr-devel
  mkl:
    - gmp-devel
    - mpfr-devel
  debug:
    - gmp-devel
    - mpfr-devel
  intel:
    - gmp-devel
    - mpfr-devel
  cuda:
    - gmp-devel
    - mpfr-devel

# Runtime system gmp/mpfr on the same set of flavors. RPM auto-detection
# picks up soname deps from ldd, but explicit package-level Requires match
# the codebase's idiom (see libevent.yaml) and survive auto-detect tweaks.
rpm_requires:
  lbl: []
  gcc:
    - gmp
    - mpfr
  mkl:
    - gmp
    - mpfr
  debug:
    - gmp
    - mpfr
  intel:
    - gmp
    - mpfr
  cuda:
    - gmp
    - mpfr

features:
  fortran: true
  mpi: true
  openmp: true
  math: parallel

configure:
  type: custom
  command: ./configure
  env:
    # PETSc configure requires PETSC_DIR to be the absolute source directory path
    - PETSC_DIR: "%{srcdir}"
  # PETSc has its own sophisticated configure - let it handle compiler detection
  # We just specify MPI compilers and optimization flags
  # Skip setting compiler env vars - PETSc uses command line args instead
  skip_compiler_env: true
  args:
    - "--prefix=%{prefix}"
    - "--with-debugging=0"
    - "--disable-static"
    - "--enable-shared"
    - "--with-pic=true"
    - "--with-threadsafety"
    - "--with-threadsafety"
    - "--with-openmp"
    # Specify MPI compilers
    - "--with-cc=mpicc"
    - "--with-cxx=mpicxx"
    - "--with-fc=mpifort"
    # Add our optimization flags (PETSc uses COPTFLAGS, not CFLAGS)
    - "--COPTFLAGS=-O2 -fPIC"
    - "--CXXOPTFLAGS=-O2 -fPIC"
    - "--FOPTFLAGS=-O2 -fPIC"
    - "--LDFLAGS=%{ldflags}"
    - "--with-cmake-exec=%{prefix}/bin/cmake"
    - "--with-ctest-exec=%{prefix}/bin/ctest"
    - "--with-cmake-dir=%{prefix}"
    - "--with-googletest-dir=%{prefix}"
    - "--with-hdf5-dir=%{prefix}"
    # Partitioners
    - "--with-metis-include=%{prefix}/include"
    - "--with-metis-lib=%{prefix}/lib/libmetis%{libext}"
    - "--with-parmetis-include=%{prefix}/include"
    - "--with-parmetis-lib=%{prefix}/lib/libparmetis%{libext}"
    - "--with-ptscotch-dir=%{prefix}"
    # Direct solvers
    - "--with-suitesparse=0"
    - "--with-superlu-dir=%{prefix}"
    - "--with-superlu_dist-dir=%{prefix}"
    - "--with-mumps-dir=%{prefix}"
    - "--with-strumpack-dir=%{prefix}"
    # I/O libraries
    - "--with-netcdf-dir=%{prefix}"
    - "--with-zfp-include=%{prefix}/include"
    - "--with-zfp-lib=%{prefix}/lib/libzfp%{libext}"
  # LP64/ILP64 integer interface
  lp64_args:
    - "--with-64-bit-blas-indices=0"
  ilp64_args:
    - "--with-64-bit-blas-indices=1"
  # Flavor-specific arguments
  flavor_args:
    gcc:
      - "--with-cuda=0"
      - "--with-hwloc-dir=%{prefix}"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--with-gmp-dir=/usr"
      - "--with-mpfr-dir=/usr"
      - "--with-blaslapack-lib=%{prefix}/lib/libopenblas%{libext}"
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp=1"
    lbl:
      - "--with-cuda=0"
      - "--with-hwloc-dir=/usr"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--with-gmp-dir=%{prefix}"
      - "--with-mpfr-dir=%{prefix}"
      - "--with-blaslapack-lib=%{prefix}/lib/libopenblas%{libext}"
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp=1"
    macos:
      - "--with-cuda=0"
      - "--with-hwloc-dir=%{prefix}"
      - "--with-gmp-dir=%{prefix}"
      - "--with-mpfr-dir=%{prefix}"
      - "--with-blas-lib=%{prefix}/lib/libopenblas%{libext}"
      - "--with-lapack-lib=%{prefix}/lib/liblapack%{libext}"
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp=1"
    debug:
      - "--with-cuda=0"
      - "--with-gmp-dir=/usr"
      - "--with-mpfr-dir=/usr"
      - "--with-blas-lib=%{prefix}/lib/libblas%{libext}"
      - "--with-lapack-lib=%{prefix}/lib/liblapack%{libext}"
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp-include=/usr/include"
      - "--with-openmp-lib=%{libgomp}"
    mkl:
      - "--with-cuda=0"
      - "--with-gmp-dir=/usr"
      - "--with-mpfr-dir=/usr"
      - "--with-blaslapack-include=%{mklroot}/include"
      - "--with-blaslapack-lib=%{mkl_linker_flags}"
      # ScaLAPACK: stack-owned build, not MKL's (see math_common policy)
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp-include=/usr/include"
      - "--with-openmp-lib=%{libgomp}"
    intel:
      - "--with-cuda=0"
      - "--with-gmp-dir=/usr"
      - "--with-mpfr-dir=/usr"
      - "--with-blaslapack-include=%{mklroot}/include"
      - "--with-blaslapack-lib=%{mkl_linker_flags}"
      # ScaLAPACK: stack-owned build, not MKL's (see math_common policy)
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--CC_LINKER_FLAGS=%{ldflags}"
      - "--CXX_LINKER_FLAGS=%{ldflags}"
      - "--with-openmp-include=/opt/intel/oneapi/compiler/latest/include"
      - "--with-openmp-lib=/opt/intel/oneapi/compiler/latest/lib/libiomp5.so"
    cuda:
      - "--with-cuda=1"
      - "--CUDAC=%{cuda}/bin/nvcc"
      - "--CUDAFLAGS=-I%{prefix}/include -I%{cuda}/include"
      - "--with-cuda-arch=%{cuda_architectures}"
      - "--with-cuda-dir=%{cuda}"
      - "--with-gmp-dir=/usr"
      - "--with-mpfr-dir=/usr"
      - "--with-blaslapack-include=%{mklroot}/include"
      - "--with-blaslapack-lib=%{mkl_linker_flags}"
      # ScaLAPACK: stack-owned build, not MKL's (see math_common policy)
      - "--with-scalapack-include=%{prefix}/include"
      - "--with-scalapack-lib=%{prefix}/lib/libscalapack%{libext}"
      - "--with-mpi-include=%{prefix}/include"
      - "--with-mpi-lib=%{prefix}/lib/libmpi%{libext}"
      - "--with-mpiexec=%{prefix}/bin/mpiexec"
      - "--with-zlib-include=%{zlib_include}"
      - "--with-zlib-lib=%{zlib_lib}"
      - "--CC_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--CXX_LINKER_FLAGS=%{ldflags} -lgfortran"
      - "--with-openmp-include=/usr/include"
      - "--with-openmp-lib=%{libgomp}"
  optimization:
    O_level: 2

build:
  parallel: true
  args:
    - "PETSC_DIR=%{srcdir}"
  # Platform-specific PETSC_ARCH
  flavor_args:
    lbl:
      - "PETSC_ARCH=arch-linux-c-opt"
    macos:
      - "PETSC_ARCH=arch-darwin-c-opt"
    debug:
      - "PETSC_ARCH=arch-linux-c-opt"
    mkl:
      - "PETSC_ARCH=arch-linux-c-opt"
    intel:
      - "PETSC_ARCH=arch-linux-c-opt"
    cuda:
      - "PETSC_ARCH=arch-linux-c-opt"

install:
  args:
    - "PETSC_DIR=%{srcdir}"
  # Platform-specific PETSC_ARCH for install
  flavor_args:
    lbl:
      - "PETSC_ARCH=arch-linux-c-opt"
    macos:
      - "PETSC_ARCH=arch-darwin-c-opt"
    debug:
      - "PETSC_ARCH=arch-linux-c-opt"
    mkl:
      - "PETSC_ARCH=arch-linux-c-opt"
    intel:
      - "PETSC_ARCH=arch-linux-c-opt"
    cuda:
      - "PETSC_ARCH=arch-linux-c-opt"
  post:
    # Fix Python shebangs
    - "find %{prefix}/lib/petsc/bin -type f -exec grep -l '/usr/bin' {} \\; | xargs -I {} sed -i 's|#!/usr/bin/env python|#!/usr/bin/python3|g; s|#!/usr/bin/python$|#!/usr/bin/python3|g' {} 2>/dev/null || true"

# Subpackage for examples
subpackages:
  - name: petsc-examples
    summary: Examples for PETSc
    requires:
      - petsc
    files:
      - "share/petsc/CMakeLists.txt"
      - "share/petsc/Makefile*"
      - "share/petsc/datafiles"
      - "share/petsc/examples"
      - "share/petsc/xml"

# PETSc tests cannot run during %check: with --prefix=/opt/scls/gcc the install
# location is hardcoded into libpetsc, so PetscInitialize_DynamicLibraries() tries
# to dlopen plugins from /opt/scls/gcc/lib — but during %check those files only
# exist in %{buildroot}/opt/scls/gcc/lib and PETSc's loader ignores LD_LIBRARY_PATH
# for the plugin lookup. This is a known limitation of PETSc's prefix-install
# model under RPM build conventions; Fedora/EPEL skip 'make check' for the same
# reason. Tests can be run by users post-install via 'make check' from the
# installed PETSC_DIR.

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lpetsc"
