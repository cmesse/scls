name: arpack-ng
version: 3.9.1
summary: Fortran 77 subroutines designed to solve large scale eigenvalue problems.
homepage: https://github.com/opencollab/arpack-ng
license: BSD

source:
  url: https://github.com/opencollab/arpack-ng/archive/%{version}/arpack-ng-%{version}.tar.gz

requires:
  all:
    - openmpi

features:
  fortran: true
  mpi: true
  openmp: false
  math: parallel


# should provide a list
configure:
  type: cmake
  args:
    - "-DCMAKE_C_FLAGS=%{cflags} %{math_flags} -Wno-implicit-function-declaration"
    - "-DCMAKE_CXX_FLAGS=%{cxxflags} %{math_flags} -Wno-implicit-function-declaration"
    - "-DCMAKE_Fortran_FLAGS=%{fcflags} %{math_flags} -fallow-argument-mismatch"
    - -DMPI=ON
    - -DMPI_BASE_DIR=%{prefix}
    - -DCMAKE_POLICY_VERSION_MINIMUM=4.0
    - -DBUILD_STATIC_LIBS=OFF
    - -DBUILD_SHARED_LIBS=ON
  # ARPACK-NG (PARPACK) links only BLAS/LAPACK, not ScaLAPACK —
  # parallelism uses MPI directly. Pin serial BLAS/LAPACK per flavor
  # so the MKL flavor does not inherit the ScaLAPACK-bearing line
  # that %{math_ldflags} would produce for parallel math recipes.
  flavor_args:
    gcc:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so"
    lbl:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so"
    macos:
      - -DTESTS=OFF
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
    debug:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libblas.so"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/liblapack.so"
    mkl:
      - "-DBLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DLAPACK_LIBRARIES=%{mkl_linker_flags}"
    intel:
      - "-DBLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DLAPACK_LIBRARIES=%{mkl_linker_flags}"
    cuda:
      - "-DBLAS_LIBRARIES=%{mkl_linker_flags}"
      - "-DLAPACK_LIBRARIES=%{mkl_linker_flags}"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  lp64_args:
    - "-DINTERFACE64=OFF"
    - "-DICB=ON"
  ilp64_args:
    - "-DINTERFACE64=ON"
    - "-DICB=ON"

build:
  parallel: true

test:
  commands:
    - "cd build && ctest --output-on-failure"