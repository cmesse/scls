name: blaze
version: 3.8.2
summary: A high-performance C++ math library for dense and sparse arithmetic
homepage: https://bitbucket.org/blaze-lib/blaze
license: BSD

source:
  url: https://bitbucket.org/blaze-lib/blaze/downloads/blaze-%{version}.tar.gz

requires:
  all:
    - cmake
  gcc:
    - openblas
  macos:
    - openblas
  debug:
    - lapack

features:
  fortran: false
  mpi: false
  openmp: false
  math: serial

configure:
  type: cmake
  optimization:
    O_level: 3
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBLAZE_BLAS_MODE=ON"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit) for BLAS calls
  lp64_args:
    - "-DBLAZE_BLAS_IS_64BIT=OFF"
  ilp64_args:
    - "-DBLAZE_BLAS_IS_64BIT=ON"
  flavor_args:
    gcc:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.so"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so"
    macos:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.dylib"
    debug:
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libblas.so"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/liblapack.so"
    mkl:
      # MKL provides BLAS/LAPACK via environment

build:
  parallel: true

test:
  commands:
    # Blaze is header-only — verify headers are usable with a minimal compile-and-run test
    - |
      cat > blaze_test.cpp << 'EOF'
      #include <blaze/Math.h>
      int main() {
        blaze::DynamicMatrix<double> A{{1,0,0},{0,1,0},{0,0,1}};
        blaze::DynamicVector<double> x{1.0, 2.0, 3.0};
        blaze::DynamicVector<double> y = A * x;
        return (y[0]==1 && y[1]==2 && y[2]==3) ? 0 : 1;
      }
      EOF
      $CXX -std=c++14 -I%{prefix}/include -O0 -o blaze_test blaze_test.cpp && ./blaze_test && echo "PASS: blaze header-only test"
    # Run the upstream blazetest suite
    - |
      BLAS_CFG="no"
      BLAS_INC=""
      BLAS_LIBPATH=""
      BLAS_LIBS=""
      LAPACK_CFG="no"
      LAPACK_LIBPATH=""
      LAPACK_LIBS=""
      if [ -f %{prefix}/lib/libopenblas.so ]; then
        BLAS_CFG="yes"
        BLAS_INC="%{prefix}/include"
        BLAS_LIBPATH="%{prefix}/lib"
        BLAS_LIBS="-lopenblas"
        LAPACK_CFG="yes"
        LAPACK_LIBPATH="%{prefix}/lib"
        LAPACK_LIBS="-lopenblas"
      elif [ -f %{prefix}/lib/libblas.so ]; then
        BLAS_CFG="yes"
        BLAS_INC="%{prefix}/include"
        BLAS_LIBPATH="%{prefix}/lib"
        BLAS_LIBS="-lblas"
        LAPACK_CFG="yes"
        LAPACK_LIBPATH="%{prefix}/lib"
        LAPACK_LIBS="-llapack"
      fi
      cat > blazetest/Configfile << CFGEOF
      CXX=$CXX
      CXXFLAGS=-std=c++14 $CXXFLAGS
      BOOST="no"
      BOOST_INCLUDE_PATH=
      BOOST_LIBRARY_PATH=
      BOOST_SYSTEM_LIBRARY=
      BOOST_THREAD_LIBRARY=
      BLAS="$BLAS_CFG"
      BLAS_INCLUDE_PATH=$BLAS_INC
      BLAS_INCLUDE_FILE=
      BLAS_LIBRARY_PATH=$BLAS_LIBPATH
      BLAS_LIBRARIES=$BLAS_LIBS
      LAPACK="$LAPACK_CFG"
      LAPACK_SUPPORTS_GESVDX="no"
      LAPACK_LIBRARY_PATH=$LAPACK_LIBPATH
      LAPACK_LIBRARIES=$LAPACK_LIBS
      LIBRARY_DIRECTIVES=-Wl,-rpath,%{prefix}/lib -L%{prefix}/lib
      CFGEOF
      cd blazetest && ./configure
      make %{?_smp_mflags} -C src/utiltest && src/utiltest/run
      for t in shims simd blas lapack typetraits traits constraints functors vectors matrices views; do
        make %{?_smp_mflags} -C src/mathtest/$t || exit 1
        test -x src/mathtest/$t/run && { src/mathtest/$t/run || exit 1; }
      done

# Blaze is header-only, no library to link
registry:
  cflags: "-I%{prefix}/include"
  ldflags: ""
