name: pmix
version: 5.0.10
release: 2
summary: An extended/exascale implementation of the PMIx Standard
homepage: https://github.com/openpmix/openpmix
license: BSD

# Not built for lbl (uses system pmix for Slurm compatibility)
exclude_flavors:
  - lbl

source:
  url: https://github.com/pmix/pmix/releases/download/v%{version}/pmix-%{version}.tar.bz2

update:
  # Pin to the 5.x line — pmix 6 changes ABI and openmpi compatibility needs
  # to be re-validated before we accept it.
  max_major: 5

requires:
  all:
    - libevent
    - hwloc

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  defaults:
    host_flags: false
  args:
    - --with-pmix-headers
    - --with-libevent=%{prefix}
    - --with-hwloc=%{prefix}
    - --with-slurm
  flavor_env:
    macos:
      CFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      CXXFLAGS: "+=-isysroot %{sdk} -I%{sdk}/usr/include"
      LDFLAGS: "+=-isysroot %{sdk}"
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
