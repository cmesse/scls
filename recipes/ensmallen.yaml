name: ensmallen
version: 2.22.2
summary: A header-only C++ library for mathematical optimization
homepage: https://ensmallen.org/
license: BSD-3-Clause

# Niche; not part of the default distributions. Build via extra_packages in flavor.conf.
include_flavors: []

source:
  url: https://github.com/mlpack/ensmallen/archive/refs/tags/%{version}.tar.gz

update:
  strategy: github_tag
  repo: mlpack/ensmallen
  tag_prefix: ""  # upstream tags are bare N.N.N, no "v" prefix

requires:
  all:
    - cmake
    - armadillo

features:
  fortran: false
  mpi: false
  openmp: true
  math: serial

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DARMADILLO_LIBRARY=%{prefix}/lib/libarmadillo%{libext}"
    - "-DARMADILLO_INCLUDE_DIR=%{prefix}/include"
    # Bandicoot (GPU backend) off for now; revisit for a CUDA flavor
    - "-DUSE_BANDICOOT=OFF"
    - "-DBUILD_TESTS=ON"
  optimization:
    O_level: 3

build:
  parallel: true

test:
  commands:
    # ensmallen_tests is EXCLUDE_FROM_ALL upstream — build it explicitly before ctest
    - "cmake --build build --target ensmallen_tests -j"
    - "cd build && ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include"
