name: gcc
version: 16.1.0
summary: The GNU Compiler Collection
homepage: https://gcc.gnu.org/
license: GPL-3.0-or-later WITH GCC-exception-3.1
bootstrap: true  # Build with system compilers (this IS the GCC we're building)

source:
  url: https://ftp.gnu.org/gnu/gcc/gcc-%{version}/gcc-%{version}.tar.xz

patches:
  macos:
    - libatomic-darwin-posix-lock-visibility.patch

update:
  strategy: gnu_ftp
  ftp_path: /gnu/gcc/
  dir_pattern: 'gcc-(\d+\.\d+\.\d+)'

# Additional sources for in-tree build (Linux From Scratch approach)
# These are extracted into the GCC source tree before configure
# Versions are pulled from the respective recipe files (single source of truth)
extra_sources:
  - recipe: gmp
    extract_to: gmp
  - recipe: mpfr
    extract_to: mpfr
  - recipe: mpc
    extract_to: mpc

include_flavors:
  - lbl
  - macos

requires:
  gcc:
    - binutils
  macos:
    - autoconf
    - automake
    - bison
    - make
    - sed
    - m4
    - zlib

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  pre:
    # Extract GMP, MPFR, MPC into GCC source tree (Linux From Scratch approach)
    # This allows GCC to build them internally with correct flags
    # %{gmp_tarball}, %{mpfr_tarball}, %{mpc_tarball} are resolved from respective recipes
    - "tar -xf %{sources}/%{gmp_tarball} && mv -v gmp-%{gmp_version} gmp"
    - "tar -xf %{sources}/%{mpfr_tarball} && mv -v mpfr-%{mpfr_version} mpfr"
    - "tar -xf %{sources}/%{mpc_tarball} && mv -v mpc-%{mpc_version} mpc"
    # Fix version detection for clang (uses GNU sed from our prefix)
    - "find . -name configure -exec sed -i 's/--version -v -V -qversion/--version -v/g' {} \\;"

  type: autotools
  args:
    - --enable-bootstrap
    - --enable-checking=release
    - --enable-languages=c,c++,fortran,lto
    - --with-system-zlib
    - --enable-shared
    - --enable-threads=posix
    - --enable-__cxa_atexit
    - --enable-plugin
    - --disable-nls
    - --disable-static
    - --disable-multilib
    - --without-isl

  flavor_args:
    gcc:
      - --enable-gnu-unique-object
      - --enable-linker-build-id
      - --with-gcc-major-version-only
      - --with-linker-hash-style=gnu
      - --enable-initfini-array
      - --disable-libmpx
      - --disable-libunwind-exceptions
      - --enable-gnu-indirect-function
      - --enable-cet
      - --with-tune=generic
      - --with-arch=x86-64-v3
      - --enable-offload-targets=nvptx-none
      - --without-cuda-driver
    macos:
      - --with-native-system-header-dir=/usr/include
      - --with-sysroot=%{sdk}

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

install:
  post:
    # Create convenience symlinks for compilers (gcc, g++, c++, gfortran)
    - "cd %{prefix}/bin && ln -sf %{host}-gcc gcc"
    - "cd %{prefix}/bin && ln -sf %{host}-g++ g++"
    - "cd %{prefix}/bin && ln -sf %{host}-c++ c++"
    - "cd %{prefix}/bin && ln -sf %{host}-gfortran gfortran"
    # Create symlinks for LTO-enabled tools (without host prefix, but keep gcc- prefix)
    # Do NOT create plain ar/nm/ranlib - let those use system tools for Mach-O support
    - "cd %{prefix}/bin && ln -sf %{host}-gcc-ar gcc-ar"
    - "cd %{prefix}/bin && ln -sf %{host}-gcc-nm gcc-nm"
    - "cd %{prefix}/bin && ln -sf %{host}-gcc-ranlib gcc-ranlib"
  flavor_post:
    macos:
      # Fix library symlinks (GCC creates versioned .dylib, we need unversioned too)
      - "cd %{prefix}/lib && for f in libatomic libgfortran libgomp libitm libquadmath libssp libstdc++; do if [ -f ${f}.1.dylib ]; then ln -sf ${f}.1.dylib ${f}.dylib; elif [ -f ${f}.5.dylib ]; then ln -sf ${f}.5.dylib ${f}.dylib; elif [ -f ${f}.0.dylib ]; then ln -sf ${f}.0.dylib ${f}.dylib; elif [ -f ${f}.6.dylib ]; then ln -sf ${f}.6.dylib ${f}.dylib; fi; done"
  flavor_final_post:
    macos:
      # Fix install names for dylibs
      - "cd %{prefix}/lib && for f in libatomic.1.dylib libgfortran.5.dylib libgomp.1.dylib libitm.1.dylib libquadmath.0.dylib libssp.0.dylib libstdc++.6.dylib libgcc_s.1.1.dylib; do if [ -f $f ]; then install_name_tool -id %{prefix}/lib/$f $f; fi; done"

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
