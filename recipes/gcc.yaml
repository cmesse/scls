name: gcc
version: 15.1.0
summary: The GNU Compiler Collection
homepage: https://gcc.gnu.org/
license: GPL-2.0

source:
  url: https://ftp.gnu.org/gnu/gcc/gcc-15.1/gcc-%{version}.tar.xz

flavors:
  - macos

requires:
  - gmp
  - mpfr
  - mpc

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  pre:
    - "for f in $(find . -name configure); do gsed -i 's/--version -v -V -qversion/--version -v/g' configure ; done"

  type: autotools
  install_prefix: "gcc"
  args:
    - --with-gmp-include=%{prefix}/include
    - --with-gmp-lib=%{prefix}/lib
    - --with-mpfr-include=%{prefix}/include
    - --with-mpfr-lib=%{prefix}/lib
    - --with-mpc-include=%{prefix}/include
    - --with-mpc-lib=%{prefix}/lib
    - --enable-checking=release
    - --enable-languages=c,c++,fortran,lto
    - --with-native-system-header-dir=/usr/include
    - --with-sysroot=%{sdk}
    - --with-system-zlib
    - --disable-nls
    - --disable-multilib
    - --program-suffix=-scls

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

install:
  post:
    - "pushd %{prefix} && mkdir -p bin && cd bin && ln -s ../gcc/bin/%{host}-gfortran-scls ./gfortran && popd"
    - "pushd %{prefix} && mkdir -p lib && cd lib && ln -s ../gcc/lib/libgomp.1.dylib ./libgomp.1.dylib && ln -s ../gcc/lib/libgomp.1.dylib ./libgomp.dylib && popd"
    - "pushd %{prefix}/gcc/lib && for f in libatomic.dylib libgfortran.dylib libgomp.dylib libitm.dylib libquadmath.dylib libssp.dylib libstdc++.dylib ; do rm -rv $f ; done
 && popd"
    - "pushd %{prefix}/gcc/lib && for f in libatomic.1.dylib libgfortran.5.dylib libgomp.1.dylib libitm.1.dylib libquadmath.0.dylib libssp.0.dylib libstdc++.6.dylib ; do install_name_tool -id %{install_prefix}/lib/$f $f ; for g in libatomic.1.dylib libgfortran.5.dylib libgomp.1.dylib libitm.1.dylib libquadmath.0.dylib libssp.0.dylib libstdc++.6.dylib libgcc_s.1.1.dylib ; do install_name_tool -change $g %{install_prefix}/lib/$g $f 2>/dev/null ; done ; install_name_tool -change @rpath/libgcc_s.1.1.dylib /opt/scls/gcc/lib/libgcc_s.1.1.dylib $f 2>/dev/null ; done && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libatomic.1.dylib ./libatomic.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libgfortran.5.dylib ./libgfortran.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libgomp.1.dylib ./libgomp.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libitm.1.dylib ./libitm.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libquadmath.0.dylib ./libquadmath.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libssp.0.dylib ./libssp.dylib && popd"
    - "pushd %{prefix}/gcc/lib && ln -s ./libstdc++.6.dylib ./libstdc++.dylib && popd"

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"