name: scalapack
version: 2.2.2
summary: A subset of LAPACK routines redesigned for heterogeneous computing
homepage: http://www.netlib.org/scalapack/

license: BSD

source:
  url: https://github.com/Reference-ScaLAPACK/scalapack/archive/refs/tags/v%{version}.tar.gz

requires:
  all:
    - openmpi
    - cmake
  gcc-debug:
    - blas
    - lapack
  macos:
    []

features:
  fortran: true
  mpi: false
  openmp: false
  math: sequential

configure:
  type: cmake
  pre:
    - "sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 4.0)/g' %{srcdir}/BLACS/INSTALL/CMakeLists.txt"
    - "sed -i 's/cmake_minimum_required(VERSION 3.9)/cmake_minimum_required(VERSION 4.0)/g' %{srcdir}/CMakeLists.txt"
  args:
    # Use gnu11 to allow K&R style function declarations
    - -DCMAKE_C_FLAGS='%{cflags} -std=gnu17 -Wno-error=implicit-function-declaration'
    - -DCMAKE_Fortran_FLAGS='%{fcflags} -O3 -fallow-argument-mismatch'
    - -DMPI_BASE_DIR=%{prefix}
    - -DCMAKE_POLICY_VERSION_MINIMUM=4.0
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  lp64_args:
    - "-DINTERFACE64=OFF"
  ilp64_args:
    - "-DINTERFACE64=ON"
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    # xcheevr/xzheevr excluded: known upstream MRRR eigensolver timeout for complex types
    # (Debian, Spack, EasyBuild all skip these — no upstream fix as of 2.2.2)
    - "cd build && ctest --output-on-failure --timeout 600 -E 'x[cz]heevr'"