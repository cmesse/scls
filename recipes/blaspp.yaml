name: blaspp
version: 2025.05.28
summary: C++ API for the Basic Linear Algebra Subprograms (BLAS)
homepage: https://icl.utk.edu/slate/
license: BSD-3-Clause

source:
  url: https://github.com/icl-utk-edu/blaspp/releases/download/v%{version}/blaspp-%{version}.tar.gz

patches:
  all:
    - blaspp_fix_testsweep.patch
    - blaspp_cblas_include.patch
    - blaspp_lapack_libpath.patch

requires:
  all:
    - cmake
    - testsweeper

features:
  fortran: false
  mpi: false
  openmp: false
  math: serial

configure:
  type: cmake
  pre:
    - "LD_LIBRARY_PATH=%{prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}; export LD_LIBRARY_PATH"
  post:
    - "unset LD_LIBRARY_PATH"
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_BUILD_RPATH=%{prefix}/lib"
    - "-Dbuild_tests=ON"
  flavor_args:
    gcc:
      - '-Dblas="OpenBLAS"'
      - '-Dlapack="generic"'
      - "-Dgpu_backend=none"
      - '-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.so'
      - '-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.so'
    macos:
      - '-Dblas="OpenBLAS"'
      - '-Dlapack="generic"'
      - "-Dgpu_backend=none"
      - '-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas.dylib'
      - '-DLAPACK_LIBRARIES=%{prefix}/lib/libopenblas.dylib'
    debug:
      - '-Dblas="generic"'
      - '-Dlapack="generic"'
      - "-Dgpu_backend=none"
      - '-DLAPACK_LIBRARIES=-llapack'
    mkl:
      # Prescribe MKL libraries explicitly — bypasses upstream BLASFinder/
      # LAPACKFinder auto-detection entirely, which is fragile across blaspp
      # versions. MKL bundles BLAS+LAPACK in the same libraries.
      # Threading: use gnu_thread (not sequential) because blaspp will be
      # linked into OpenMP applications. CMAKE_LIBRARY_PATH already contains
      # the MKL lib directory (set by get_cmake_args in build_common).
      - "-Dgpu_backend=none"
    cuda:
      - "-Dgpu_backend=cuda"
  # LP64/ILP64 integer interface + MKL library selection
  lp64_args:
    - '-Dblas_int=int (LP64)'
  lp64_flavor_args:
    mkl:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
    cuda:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
  ilp64_args:
    - '-Dblas_int=int64_t (ILP64)'
  ilp64_flavor_args:
    mkl:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
    cuda:
      - '-DBLAS_LIBRARIES=%{mkl_linker_flags}'
      - '-DLAPACK_LIBRARIES=%{mkl_linker_flags}'
  optimization:
    O_level: 3

build:
  parallel: true
  in_source: false  # Build in separate directory

test:
  commands:
    - "cd build/test && LD_LIBRARY_PATH=%{prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH} python3 run_tests.py --quick"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lblaspp"
