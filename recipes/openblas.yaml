name: openblas
version: 0.3.33
summary: An optimized BLAS library based on GotoBLAS2
homepage: https://github.com/OpenMathLib/OpenBLAS
license: BSD-3-Clause

source:
  url: https://github.com/OpenMathLib/OpenBLAS/archive/v%{version}/OpenBLAS-%{version}.tar.gz

# Debug flavor uses reference BLAS/LAPACK, MKL flavors use Intel MKL.
# debug inherits from gcc, so it also needs an explicit exclusion.
include_flavors:
  - gcc
  - lbl
  - macos
exclude_flavors:
  - debug

patches:
  # Drop extra 'p' from threaded library name
  - file: openblas-0.2.5-libname.patch
  # Supply the proper flags to the test makefile
  - file: openblas-0.3.11-tests.patch

requires:
  macos:
    - gcc

features:
  fortran: true
  mpi: false
  openmp: true
  math: false

configure:
  # OpenBLAS uses plain Makefile, not autotools or cmake
  type: none

build:
  parallel: true
  args:
    - "USE_OPENMP=1"
    # NUM_THREADS sets the COMPILE-TIME maximum thread count, not the
    # runtime count (that's controlled by OPENBLAS_NUM_THREADS /
    # OMP_NUM_THREADS). Without this, OpenBLAS defaults NUM_THREADS to
    # `getconf _NPROCESSORS_ONLN` at build time. In constrained build
    # environments (mockbuild containers, CI runners with cgroup
    # limits, some EC2 instance types) that probe can return 1, at
    # which point OpenBLAS overrides USE_THREAD to 0 and silently
    # disables OpenMP — producing a sequential libopenblas regardless
    # of USE_OPENMP=1. STRUMPACK then calls non-thread-safe sequential
    # GEMMs from concurrent OMP threads and corrupts results. Caught
    # on Amazon Linux; fix applied universally for build-host
    # independence. 256 covers any plausible HPC node; the cost is a
    # few extra MB of static thread buffers in libopenblas.
    - "NUM_THREADS=256"
    - "NO_LAPACK=0"
    - "NO_LAPACKE=0"
    - "NO_CBLAS=0"
    - "DYNAMIC_ARCH=1"
    - "NO_STATIC=1"
  flavor_args:
    macos:
      - "BINARY=64"
      - "NO_AVX512=1"
    debug:
      - "TARGET=GENERIC"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  lp64_args:
    - "INTERFACE64=0"
  ilp64_args:
    - "INTERFACE64=1"

install:
  args:
    - "PREFIX=%{prefix}"
  post:
    # Remove static archives (we only want shared libraries)
    - "rm -f %{prefix}/lib/libopenblas*.a"
    # Create compatibility symlinks: libblas/libcblas/liblapack/liblapacke -> libopenblas
    # OpenBLAS includes BLAS, CBLAS, LAPACK, and LAPACKE in the same library
    - "cd %{prefix}/lib && ln -sf libopenblas.so libblas.so || true"
    - "cd %{prefix}/lib && ln -sf libopenblas.so libcblas.so || true"
    - "cd %{prefix}/lib && ln -sf libopenblas.so liblapack.so || true"
    - "cd %{prefix}/lib && ln -sf libopenblas.so liblapacke.so || true"
  flavor_post:
    macos:
      - "cd %{prefix}/lib && ln -sf libopenblas.dylib libblas.dylib || true"
      - "cd %{prefix}/lib && ln -sf libopenblas.dylib libcblas.dylib || true"
      - "cd %{prefix}/lib && ln -sf libopenblas.dylib liblapack.dylib || true"
      - "cd %{prefix}/lib && ln -sf libopenblas.dylib liblapacke.dylib || true"

test:
  inherit_build_args: true
  commands:
    - "make tests"

registry:
  cflags: "-I%{prefix}/include/openblas"
  ldflags: "-L%{prefix}/lib -lopenblas"
