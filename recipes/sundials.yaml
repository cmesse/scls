name: sundials
version: 7.8.0
release: 1
summary: Nonlinear and Differential/Algebraic Equation Solvers
homepage: https://computing.llnl.gov/projects/sundials
license: BSD-3-Clause

source:
  url: https://github.com/LLNL/sundials/releases/download/v%{version}/sundials-%{version}.tar.gz

patches:
  all:
    - sundials-use-system-gtest.patch

requires:
  all:
    - cmake
    - openmpi
    - petsc

# SUNDIALS' FindPETSC.cmake invokes pkg_check_modules, which needs
# pkg-config on PATH at configure time.
rpm_build_requires:
  - pkgconf-pkg-config

features:
  fortran: false
  mpi: true
  openmp: true
  math: serial

configure:
  type: cmake
  args:
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DSUNDIALS_INSTALL_CMAKEDIR=lib/cmake/sundials"
    - "-DENABLE_MPI=ON"
    - "-DENABLE_OPENMP=ON"
    # PETSc integration (NVECTOR_PETSC, SUNNONLINSOL_PETSCSNES)
    - "-DENABLE_PETSC=ON"
    - "-DPETSC_DIR=%{prefix}"
    - "-DENABLE_KLU=OFF"
    - "-DMPIEXEC_EXECUTABLE=%{prefix}/bin/mpiexec"
    - "-DEXAMPLES_ENABLE_C=ON"
    - "-DEXAMPLES_ENABLE_CXX=ON"
    - "-DEXAMPLES_INSTALL=ON"
    - "-DSUNDIALS_EXAMPLES_INSTALL_PATH=%{prefix}/share/sundials/examples"
    # Testing — use system GTest at %{prefix} (SUNDIALS' bundled FetchContent
    # 1.16.0 is incompatible with GCC 15, but the cmake logic prefers an
    # already-installed system GTest, which we have at %{prefix}).
    - "-DSUNDIALS_TEST_ENABLE_UNIT_TESTS=ON"
    - "-DSUNDIALS_TEST_ENABLE_GTEST=ON"
    - "-DSUNDIALS_TEST_ENABLE_DIFF_OUTPUT=OFF"
    - "-DGTest_ROOT=%{prefix}"
    # Defer GoogleTest case discovery from build-time (POST_BUILD, default,
    # 5s timeout) to ctest-time (PRE_TEST). On macOS the first launch of an
    # unsigned binary triggers a synchronous Gatekeeper/XProtect scan, which
    # combined with dyld resolving SUNDIALS' many shared deps regularly blows
    # the 5s budget and aborts `make`. SUNDIALS' own gtest_discover_tests()
    # calls pass no explicit mode, so this CMake variable wins. Linux builds
    # are unaffected — they did not hit the timeout but also gain nothing
    # from running discovery at build-time, so flipping it globally is safe.
    - "-DCMAKE_GTEST_DISCOVER_TESTS_DISCOVERY_MODE=PRE_TEST"
  # LP64/ILP64 index size
  lp64_args:
    - "-DSUNDIALS_INDEX_SIZE=32"
  ilp64_args:
    - "-DSUNDIALS_INDEX_SIZE=64"
  flavor_args:
    cuda:
      - "-DENABLE_CUDA=ON"
      - "-DCMAKE_CUDA_COMPILER=%{cuda}/bin/nvcc"
      - "-DCMAKE_CUDA_ARCHITECTURES=%{cuda_architectures}"
  # ILP64 with MKL enables oneMKL
  ilp64_flavor_args:
    mkl:
      - "-DENABLE_ONEMKL=ON"
    intel:
      - "-DENABLE_ONEMKL=ON"
    cuda:
      - "-DENABLE_ONEMKL=ON"
  optimization:
    O_level: 3

build:
  parallel: true

test:
  commands:
    # Prepend the in-tree build library directories to LD_LIBRARY_PATH so ctest
    # (and the PRE_TEST GoogleTest discovery step) resolves against the freshly
    # built libsundials_* instead of any older SUNDIALS installed under
    # %{prefix}/lib. CMake's build RPATH puts external link paths (which
    # include %{prefix}/lib, pulled in by GTest/MPI/PETSc) ahead of the
    # in-tree build dirs, so on a stack that already carries an older SUNDIALS
    # the loader picks the stale library and any new symbol lookup fails.
    - |
      cd build && \
      libdirs=$(find "$PWD/src" -name 'lib*.so*' -exec dirname {} \; | sort -u | tr '\n' ':') && \
      LD_LIBRARY_PATH="${libdirs}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" ctest --output-on-failure

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lsundials_cvode -lsundials_nvecserial"

subpackages:
  - name: sundials-examples
    summary: Example programs for SUNDIALS
    description: |
      Example source files for the SUNDIALS solvers (ARKODE, CVODE, CVODES,
      IDA, IDAS, KINSOL), including serial, parallel (MPI), OpenMP, and
      PETSc variants.
    requires:
      - sundials
    files:
      - "share/sundials/examples"
