name: bison
version: 3.8.2
summary: A GNU general-purpose parser generator
homepage: https://www.gnu.org/software/bison/
license: GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Bison-exception-2.2 AND GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND LGPL-3.0-or-later AND LGPL-2.1-or-later AND LGPL-2.0-or-later AND FSFULLR AND GFDL-1.3-or-later AND X11

source:
  url: https://ftp.gnu.org/gnu/bison/bison-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires:
  - m4
  - autoconf

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  flavor_args:
    macos:
      - "--with-libiconv-prefix=%{sdk}/usr"
      - "--with-libintl-prefix=%{sdk}/usr"
build:
  parallel: true

install:
  post:
    - "rm -vf %{prefix}/lib/liby.a"

test:
  commands:
    - "make -j 8 check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"