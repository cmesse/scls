name: netcdf
version: 4.10.0
summary: Libraries for the Unidata network Common Data Form
homepage: https://www.unidata.ucar.edu/software/netcdf/
license: NetCDF

source:
  url: https://downloads.unidata.ucar.edu/netcdf-c/%{version}/netcdf-c-%{version}.tar.gz

update:
  strategy: github_tag
  repo: Unidata/netcdf-c
  tag_prefix: "v"

requires:
  all:
    - cmake
    - hdf5
    - openmpi

features:
  fortran: false
  mpi: true
  openmp: false
  math: none

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    # HDF5 settings
    - "-DNETCDF_ENABLE_HDF5=ON"
    - "-DHDF5_DIR=%{prefix}"
    - "-DHDF5_C_COMPILER_EXECUTABLE=%{prefix}/bin/h5cc"
    - "-DHDF5_C_INCLUDE_DIR=%{prefix}/include"
    - "-DHDF5_DIFF_EXECUTABLE=%{prefix}/bin/h5diff"
    - "-DHDF5_hdf5_LIBRARY_RELEASE=%{prefix}/lib/libhdf5%{libext}"
    - "-DHDF5_hdf5_hl_LIBRARY_RELEASE=%{prefix}/lib/libhdf5_hl%{libext}"
    # Disable optional features we don't need
    - "-DNETCDF_ENABLE_DAP=OFF"
    - "-DNETCDF_ENABLE_DAP2=OFF"
    - "-DNETCDF_ENABLE_DAP4=OFF"
    - "-DNETCDF_ENABLE_EXAMPLES=OFF"
    - "-DNETCDF_ENABLE_HDF4=OFF"
    - "-DNETCDF_ENABLE_LIBXML2=OFF"
    - "-DNETCDF_ENABLE_DISKLESS=OFF"
    - "-DNETCDF_ENABLE_PLUGINS=OFF"
    - "-DNETCDF_ENABLE_NCZARR=OFF"
    - "-DNETCDF_ENABLE_FILTER_TESTING=OFF"
    # MPI settings
    - "-DMPIEXEC_EXECUTABLE=%{prefix}/bin/mpiexec"
  optimization:
    O_level: 2

build:
  parallel: true

test:
  commands:
    # Skip nc_test4_run_par_test — flaky parallel HDF5 test, not a netcdf regression.
    - "cd build && ctest --output-on-failure -E nc_test4_run_par_test"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lnetcdf"
