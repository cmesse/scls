name: gperftools
version: 2.18.1
release: 2
summary: Very fast malloc and performance analysis tools
homepage: https://github.com/gperftools/gperftools
license: BSD

source:
  url: https://github.com/gperftools/gperftools/releases/download/gperftools-%{version}/gperftools-%{version}.tar.gz

requires:
  gcc:
    - libunwind
  mkl:
    - libunwind
  debug:
    - libunwind
  intel:
    - libunwind
  lbl:
    - libunwind
  gcc-mkl-cuda:
    - libunwind
  macos:
    - autoconf
    - automake
    - libtool
    - make

rpm_build_requires:
  - autoconf
  - automake
  - libtool
  - make
  - perl-generators

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  args:
    - "--disable-static"
    - "--enable-shared"
    - "--enable-libunwind"
    # Skip the pprof-dependent checks on every host. configure.ac:500-503
    # enables them whenever any `pprof` is on PATH, and 2.18.1 expects the Go
    # pprof: with the Perl /usr/bin/pprof (EPEL `pprof`, el9/el10),
    # profiler_unittest.sh fails on `--unit=ms` and heap-profiler_unittest.sh
    # / heap-profiler_debug_unittest.sh on `--hide=`. A set-but-empty cache
    # variable makes configure skip the PATH search, so PPROF_PATH stays empty
    # and SKIP_PPROF_TESTS is true. This also drops sampling_test and
    # sampling_debug_test (5 checks in all; those two passed with the Perl
    # pprof), accepted so the result does not depend on the build host. We do
    # not build Go to get the Go pprof. Must be the cache variable: PPROF_PATH=
    # does not stop the search. Test-only; nothing installed changes.
    # Christian, 2026-10-04.
    - "ac_cv_path_PPROF_PATH="
  # RPM %build exports LDFLAGS with -L%{prefix}/lib but no include path, so
  # configure did not find the stack's libunwind.h and silently built
  # without libunwind (el9/el10/amzn 2.18.1-1; the DEB env finds it through
  # CPATH). Linux only: macOS has no libunwind recipe. Christian, 2026-10-03.
  platform_env:
    linux:
      CPPFLAGS: "-I%{prefix}/include"
  # --enable-libunwind falls back silently when the header or -lunwind is
  # missing. Upstream defines USE_LIBUNWIND in src/config.h only when both
  # work (configure.ac:275-280); refuse to build without it on Linux.
  post:
    - "if [ \"$(uname -s)\" = Linux ] && ! grep -q '^#define USE_LIBUNWIND 1' src/config.h; then echo 'ERROR: gperftools configured without libunwind' >&2; exit 1; fi"

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -ltcmalloc"
