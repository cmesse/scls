name: suitesparse
version: 7.12.2
summary: A collection of sparse matrix libraries
homepage: https://faculty.cse.tamu.edu/davis/suitesparse.html
license: LGPL-2.1-or-later AND BSD-3-Clause AND GPL-2.0-or-later AND Apache-2.0
# Module licenses in play (SuiteSparse 7.12):
#   BSD-3-Clause: AMD, BTF, CAMD, CCOLAMD, COLAMD, SuiteSparse_config, LAGraph
#   LGPL-2.1+:    CHOLMOD (core), CXSparse, KLU, LDL
#   GPL-2.0+:     CHOLMOD (supernodal), ParU, RBio, SPEX, SPQR, UMFPACK
#   Apache-2.0:   GraphBLAS
# Mongoose (GPL-3.0+) is explicitly excluded via SUITESPARSE_ENABLE_PROJECTS
# below — SCLS does not redistribute GPL-3 binaries.

source:
  url: https://github.com/DrTimothyAldenDavis/SuiteSparse/archive/refs/tags/v%{version}.tar.gz

requires:
  all:
    - cmake
    - metis

# System gmp/mpfr on mainline Linux flavors.  SuiteSparse's SPEX component
# needs these, but we do not redistribute SCLS-owned gmp/mpfr packages there.
rpm_build_requires:
  lbl: []
  gcc:
    - gmp-devel
    - mpfr-devel
  mkl:
    - gmp-devel
    - mpfr-devel
  debug:
    - gmp-devel
    - mpfr-devel
  intel:
    - gmp-devel
    - mpfr-devel
  cuda:
    - gmp-devel
    - mpfr-devel

rpm_requires:
  lbl: []
  gcc:
    - gmp
    - mpfr
  mkl:
    - gmp
    - mpfr
  debug:
    - gmp
    - mpfr
  intel:
    - gmp
    - mpfr
  cuda:
    - gmp
    - mpfr

features:
  fortran: true
  mpi: false
  openmp: true
  math: serial

configure:
  type: cmake
  pre:
    - "LD_LIBRARY_PATH=%{prefix}/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}; export LD_LIBRARY_PATH"
  post:
    - "unset LD_LIBRARY_PATH"
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DCMAKE_BUILD_RPATH=%{prefix}/lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_STATIC_LIBS=OFF"
    - "-DBLA_STATIC=OFF"
    - "-DBUILD_TESTING=ON"
    # Explicit project allowlist: excludes Mongoose (GPL-3.0) and pins the
    # shipped set so new upstream modules don't silently land in the RPM.
    - '-DSUITESPARSE_ENABLE_PROJECTS=suitesparse_config;amd;btf;camd;ccolamd;cholmod;colamd;cxsparse;graphblas;klu;lagraph;ldl;paru;rbio;spex;spqr;umfpack'
  # LP64/ILP64 integer interface
  lp64_args:
    - "-DSUITESPARSE_USE_64BIT_BLAS=OFF"
  ilp64_args:
    - "-DSUITESPARSE_USE_64BIT_BLAS=ON"
  # BLA_VENDOR is always explicitly set per flavor
  # For non-MKL flavors: set directly in flavor_args
  # For MKL flavors: set via lp64_flavor_args/ilp64_flavor_args (vendor differs by interface)
  flavor_args:
    gcc:
      - "-DBLA_VENDOR=OpenBLAS"
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas%{libext}"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/liblapack%{libext}"
      - "-DSUITESPARSE_USE_CUDA=OFF"
    macos:
      - "-DBLA_VENDOR=OpenBLAS"
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libopenblas%{libext}"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/liblapack%{libext}"
      - "-DSUITESPARSE_USE_CUDA=OFF"
    debug:
      - "-DBLA_VENDOR=Generic"
      - "-DBLAS_LIBRARIES=%{prefix}/lib/libblas%{libext}"
      - "-DLAPACK_LIBRARIES=%{prefix}/lib/liblapack%{libext}"
      - "-DSUITESPARSE_USE_CUDA=OFF"
    mkl:
      - "-DSUITESPARSE_USE_CUDA=OFF"
    intel:
      - "-DSUITESPARSE_USE_CUDA=OFF"
    cuda:
      - "-DSUITESPARSE_USE_CUDA=ON"
  # MKL vendor depends on interface (LP64 vs ILP64)
  lp64_flavor_args:
    mkl:
      - "-DBLA_VENDOR=Intel10_64lp"
    intel:
      - "-DBLA_VENDOR=Intel10_64lp"
    cuda:
      - "-DBLA_VENDOR=Intel10_64lp"
  ilp64_flavor_args:
    mkl:
      - "-DBLA_VENDOR=Intel10_64ilp"
    intel:
      - "-DBLA_VENDOR=Intel10_64ilp"
    cuda:
      - "-DBLA_VENDOR=Intel10_64ilp"
  optimization:
    O_level: 2

build:
  parallel: true
  in_source: false

test:
  commands:
    - "cd build && ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include/suitesparse"
  ldflags: "-L%{prefix}/lib -lumfpack -lcholmod -lamd -lcolamd -lsuitesparseconfig"
