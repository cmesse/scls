name: zlib
summary: Compression and decompression library
homepage: https://zlib.net
license: zlib and Boost
bootstrap: true  # Build with system compiler before scls gcc is available

# Platform-specific source and version
linux:
  version: 1.3.1
  source:
    url: https://zlib.net/zlib-%{version}.tar.xz
macos:
  version: 1.2.12
  source:
    url: https://github.com/apple-oss-distributions/zlib/archive/zlib-100.tar.gz

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: custom
  command: ./configure
  args:
    - "--prefix=%{prefix}"
  optimization:
    O_level: 2
    strict_aliasing: true
  # Platform-specific pre-configure commands
  platform_pre:
    macos:
      # Apple's zlib source has a different structure
      - "ln -s %{srcdir}/libz.exp %{srcdir}/zlib/libz.exp"
  # Platform-specific environment variables
  platform_env:
    macos:
      SRCROOT: "%{srcdir}/zlib"
      LDFLAGS: "-headerpad_max_install_names"

install:
  post:
    - "rm -vf %{prefix}/lib/libz.a"
    # Write a clean zlib.pc file (use %{final_prefix} for content, %{prefix} for file path)
    - |
      mkdir -p %{prefix}/lib/pkgconfig
      cat > %{prefix}/lib/pkgconfig/zlib.pc << EOF
      prefix=%{final_prefix}
      exec_prefix=\${prefix}
      libdir=\${exec_prefix}/lib
      includedir=\${prefix}/include

      Name: zlib
      Description: zlib compression library
      Version: %{version}

      Requires:
      Libs: -L\${libdir} -lz
      Cflags: -I\${includedir}
      EOF
  # Platform-specific post-install (library naming conventions differ)
  platform_post:
    macos:
      # Apple's build creates .so files, rename to .dylib
      - "if [ -f %{prefix}/lib/libz.so.%{version} ]; then cd %{prefix}/lib && mv libz.so.%{version} libz.%{version}.dylib; fi"
      - "if [ -f %{prefix}/lib/libz.so.1 ]; then cd %{prefix}/lib && rm libz.so.1; fi"
      - "if [ -f %{prefix}/lib/libz.so ]; then cd %{prefix}/lib && rm libz.so; fi"
      - "cd %{prefix}/lib && ln -sf libz.%{version}.dylib libz.1.dylib"
      - "cd %{prefix}/lib && ln -sf libz.%{version}.dylib libz.dylib"
      - "install_name_tool -id %{prefix}/lib/libz.%{version}.dylib %{prefix}/lib/libz.%{version}.dylib"

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"