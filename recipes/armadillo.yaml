name: armadillo
version: 15.2.6
summary: Fast C++ matrix library with syntax similar to MATLAB and Octave
homepage: http://arma.sourceforge.net/
license: Apache-2.0

source:
  url: http://sourceforge.net/projects/arma/files/armadillo-%{version}.tar.xz

patches:
  all:
    - armadillo-add-allow-mkl-option.patch

update:
  strategy: html_regex
  url: https://arma.sourceforge.net/download.html
  pattern: 'armadillo-(\d+\.\d+\.\d+)\.tar\.xz'

requires:
  all:
    - cmake
    - arpack-ng
    - superlu
    - metis

features:
  fortran: false
  mpi: false
  openmp: false
  math: serial

configure:
  type: cmake
  optimization:
    O_level: 3
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DALLOW_FLEXIBLAS_LINUX=OFF"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  # Armadillo uses ALLOW_BLAS_LONG_LONG for ILP64 BLAS
  lp64_args:
    - "-DALLOW_BLAS_LONG_LONG=OFF"
  ilp64_args:
    - "-DALLOW_BLAS_LONG_LONG=ON"
  flavor_args:
    macos:
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.dylib"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.dylib"
      - "-DBLAS_LIBRARY=%{prefix}/lib/libopenblas.dylib"
      - "-DLAPACK_LIBRARY=%{prefix}/lib/liblapack.dylib"
    debug:
      - "-DALLOW_MKL_LINUX=OFF"
      - "-DCMAKE_DISABLE_FIND_PACKAGE_MKL=TRUE"
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      - "-DBLAS_LIBRARY=%{prefix}/lib/libblas.so"
      - "-DLAPACK_LIBRARY=%{prefix}/lib/liblapack.so"
    gcc:
      - "-DALLOW_MKL_LINUX=OFF"
      # Pin to OpenBLAS and block find_package(MKL) so host-installed MKL
      # doesn't get linked into libarmadillo.so
      - "-DCMAKE_DISABLE_FIND_PACKAGE_MKL=TRUE"
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      - "-DBLAS_LIBRARY=%{prefix}/lib/libopenblas.so"
      - "-DLAPACK_LIBRARY=%{prefix}/lib/libopenblas.so"
    lbl:
      - "-DALLOW_MKL_LINUX=OFF"
      - "-DCMAKE_DISABLE_FIND_PACKAGE_MKL=TRUE"
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      - "-DBLAS_LIBRARY=%{prefix}/lib/libopenblas.so"
      - "-DLAPACK_LIBRARY=%{prefix}/lib/libopenblas.so"

    mkl:
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      # Pin BLAS discovery to MKL so a host-installed OpenBLAS cannot
      # sneak in via CMake's FindBLAS search order.
      - "-DBLA_VENDOR=Intel10_64lp"
      - "-DALLOW_MKL_LINUX=ON"
    intel:
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      - "-DBLA_VENDOR=Intel10_64lp"
      - "-DALLOW_MKL_LINUX=ON"
    cuda:
      - "-DARPACK_LIBRARY=%{prefix}/lib/libarpack.so"
      - "-DSuperLU_LIBRARY=%{prefix}/lib/libsuperlu.so"
      - "-DBLA_VENDOR=Intel10_64lp"
      - "-DALLOW_MKL_LINUX=ON"

build:
  parallel: true

test:
  commands:
    - |
      cd build/tests1
      case "$(uname -m)" in
        x86_64) LOADER=/lib64/ld-linux-x86-64.so.2 ;;
        aarch64)
          LOADER=/lib/ld-linux-aarch64.so.1
          [ -e "$LOADER" ] || LOADER=/lib64/ld-linux-aarch64.so.1
          ;;
        *)
          echo "Unsupported architecture for Armadillo smoke test: $(uname -m)" >&2
          exit 1
          ;;
      esac
      "$LOADER" --library-path "$PWD/..:%{prefix}/lib" ./smoke_test

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -larmadillo"
