name: parmetis
version: 4.0.3
summary: Parallel Graph Partitioning and Fill-reducing Matrix Ordering
homepage: https://github.com/KarypisLab/ParMETIS
license: Apache-2.0

source:
  # Pinned to commit 8ee6a372 (2023-03-26) - no tagged releases available
  url: https://github.com/KarypisLab/ParMETIS/archive/8ee6a372ca70.tar.gz

requires:
  all:
    - cmake
    - gklib
    - metis
    - openmpi

features:
  fortran: false
  mpi: true
  openmp: true
  math: false

configure:
  type: cmake
  pre:
    - "sed -i 's/cmake_minimum_required(VERSION 2.8)/cmake_minimum_required(VERSION 3.10)/' %{srcdir}/CMakeLists.txt"
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DSHARED=ON"
    - "-DOPENMP=ON"
    - "-DGKLIB_PATH=%{prefix}"
    - "-DMETIS_PATH=%{prefix}"
  optimization:
    O_level: 2

build:
  parallel: true

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lparmetis -lmetis"
