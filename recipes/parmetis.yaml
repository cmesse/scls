name: parmetis
version: 4.0.3
summary: Parallel Graph Partitioning and Fill-reducing Matrix Ordering
homepage: http://glaros.dtc.umn.edu/gkhome/views/metis
license: Apache-2.0

source:
  url: http://glaros.dtc.umn.edu/gkhome/fetch/sw/parmetis/parmetis-%{version}.tar.gz

requires:
  all:
    - cmake
    - metis  # ParMETIS inherits LP64/ILP64 from METIS headers

features:
  fortran: false
  mpi: true
  openmp: true
  math: false

patches:
  all:
    - parmetis_min_cmake_3.10.patch
    - parmetis_use_installed_metis.patch

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DSHARED=ON"
    - "-DOPENMP=ON"
  optimization:
    O_level: 2

build:
  parallel: true

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lparmetis -lmetis"
