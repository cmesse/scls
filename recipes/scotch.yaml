name: scotch
version: 7.0.15
release: 3
summary: Graph, mesh and hypergraph partitioning library
homepage: https://www.labri.fr/perso/pelegrin/scotch/
license: CeCILL-C

source:
  url: https://gitlab.inria.fr/scotch/scotch/-/archive/v%{version}/scotch-v%{version}.tar.bz2

update:
  strategy: gitlab
  instance: https://gitlab.inria.fr
  repo: scotch/scotch
  tag_prefix: "v"

patches:
  all:
    # Add missing mpi.h include for GCC 7+ compatibility
    - scotch-include_headers.patch
    # Force shared library builds with proper rpath
    - scotch-shared.patch
    # Serialize parser_ll_c behind parser_yy_c (parallel-build race on bison-less hosts)
    - scotch-parser-race.patch

requires:
  all:
    - cmake
    - openmpi
  # liblzma for scotch's .xz graph-file support. The Apple SDK has zlib and
  # bzip2 but no lzma.h, and on lbl the host's xz-devel cannot be assumed,
  # so macOS and lbl build xz in-stack (recipes/xz.yaml).
  # Merged with all: (build_order.normalize_dependencies).
  macos:
    - xz
  lbl:
    - xz

# Compressed graph files (gzip, bzip2, xz) are on everywhere, from the
# distro libraries on Linux (Christian, 2026-10-03). Declared explicitly
# because AutoReqProv is off; before 7.0.15-2 they came in only when the
# build host happened to have the -devel packages.
rpm_build_requires:
  all:
    - bison
    - flex
    - zlib-devel
    - bzip2-devel
  # System liblzma on the mainline flavors. lbl links the stack's xz
  # (requires: above); its empty list stops the fallback to gcc:, which lbl
  # inherits. debug inherits gcc:, gcc-mkl-cuda matches mkl:.
  gcc:
    - xz-devel
  mkl:
    - xz-devel
  intel:
    - xz-devel
  lbl: []

rpm_requires:
  all:
    - zlib
    - bzip2-libs
  gcc:
    - xz-libs
  mkl:
    - xz-libs
  intel:
    - xz-libs
  lbl: []

features:
  fortran: true
  mpi: true
  openmp: false
  math: false

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-DBUILD_LIBESMUMPS=ON"
    - "-DBUILD_LIBSCOTCHMETIS=ON"
    # Prefix the METIS/ParMETIS emulation (SCOTCH_METIS_*, SCOTCH_ParMETIS_*;
    # Fortran scotchf*), as PETSc does for the Scotch it builds itself
    # (config/BuildSystem/config/packages/PTSCOTCH.py). Without it,
    # libptscotchparmetisv3 exports unprefixed ParMETIS_V3_* next to the real
    # libparmetis, and libpetsc, which links both, bound ParMETIS_V3_PartKway
    # and ParMETIS_V3_Mesh2Dual to Scotch's emulation (measured on the macOS
    # install, 2026-10-04). The emulation library itself has to stay:
    # PETSc's PT-Scotch check links it and its partitioner calls
    # SCOTCH_ParMETIS_V3_NodeND. Christian, 2026-10-04;
    # devlog/dl20261004_campaign_policy_and_math_campaign.md.
    - "-DSCOTCH_METIS_PREFIX=ON"
    - "-DBUILD_PTSCOTCH=ON"
    - "-DINSTALL_METIS_HEADERS=OFF"
    - "-DTHREADS=OFF"
    # Compressed graph-file support, all three formats on every flavor
    # (Christian, 2026-10-03). The COMMON_FILE_COMPRESS_*=OFF flags these
    # replace were never read by scotch's CMake, so the result used to depend
    # on which -devel packages the build host had. find_package() is not
    # REQUIRED upstream (src/CMakeLists.txt:161-172); configure.post below
    # turns a missing library into a build failure.
    - "-DUSE_ZLIB=ON"
    - "-DUSE_BZ2=ON"
    - "-DUSE_LZMA=ON"
  # Integer interface: LP64 (32-bit) vs ILP64 (64-bit)
  # Scotch uses INTSIZE cmake option
  lp64_args:
    - "-DINTSIZE=32"
  ilp64_args:
    - "-DINTSIZE=64"
  optimization:
    O_level: 2
  # CMake caches FIND_PACKAGE_MESSAGE_DETAILS_<pkg> only when the package was
  # found. The RPM spec runs this from build/, unix_builder from the source
  # root, so look in both.
  post:
    - "c=CMakeCache.txt; [ -f \"$c\" ] || c=build/CMakeCache.txt; for p in ZLIB BZip2 LibLZMA; do grep -q \"^FIND_PACKAGE_MESSAGE_DETAILS_$p:\" \"$c\" || { echo \"ERROR: scotch compression library $p not found\" >&2; exit 1; }; done"

build:
  parallel: true

install:
  post:
    # Bundle CeCILL-C license text; upstream ships LICENSE_en.txt (English)
    # and LICENSE_fr.txt (French) at the source root. install.post runs in
    # the cmake build/ subdir (after `cd build && make install`), so the
    # source-root license file is one level up. `%{prefix}` alone is correct
    # here — the rpm_builder post-processor rewrites it to
    # `%{buildroot}%{prefix}` automatically. Avoid `install -D` because BSD
    # install (macOS) interprets `-D` differently from GNU install.
    - "mkdir -p %{prefix}/share/licenses/scotch"
    - "install -m 644 ../LICENSE_en.txt %{prefix}/share/licenses/scotch/LICENSE"

test:
  commands:
    - "cd build && ctest --output-on-failure"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lscotch -lscotcherr -lptscotch -lptscotcherr"
