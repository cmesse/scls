name: texinfo
version: 7.2
summary: Tools needed to create Texinfo format documentation files
homepage: https://www.gnu.org/software/texinfo/
license: GPL-3.0-or-later

source:
  url: https://ftp.gnu.org/gnu/texinfo/texinfo-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires: []

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  flavor_args:
    macos:
      - "--with-libiconv-prefix=%{sdk}/usr"
      - "--with-libintl-prefix=%{sdk}/usr"

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"