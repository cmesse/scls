name: mpfr
version: 4.2.2
summary: C library for multiple-precision floating-point computations
homepage: https://www.mpfr.org/
license: LGPL-3.0-or-later
# LGPL-3 — not redistributed as an SCLS package on mainline Linux flavors.
# petsc links against the system mpfr-devel there, and GCC consumes mpfr
# via its `extra_sources:` block (in-tree build). Built in-stack only on
# `macos` (no reliable system mpfr-devel) and `lbl` (LBL HPC target that
# maintains its own full toolchain).

source:
  url: https://www.mpfr.org/mpfr-current/mpfr-%{version}.tar.xz

include_flavors:
  - macos
  - lbl

update:
  strategy: html_regex
  url: https://www.mpfr.org/mpfr-current/
  pattern: 'mpfr-(\d+\.\d+\.\d+)\.tar'

requires:
  all:
    - gcc  # libmpfr links libgcc_s; stack GCC is available on macos + lbl
    - gmp
  macos:
    - make
    - sed

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  args:
    - --enable-thread-safe
    - --with-gmp-include=%{prefix}/include
    - --with-gmp-lib=%{prefix}/lib

  # Flavor-specific configure arguments
  flavor_env:
    macos:
      - SED: "%{prefix}/bin/gsed"
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check"