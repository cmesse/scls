name: automake
version: 1.18
summary: A GNU tool for automatically creating Makefiles
homepage: https://www.gnu.org/software/autoconf/
license: GPL-2.0-or-later AND GPL-2.0-or-later WITH Autoconf-exception-generic AND GPL-3.0-or-later AND GPL-3.0-or-later WITH Autoconf-exception-generic-3.0 AND GPL-3.0-or-later WITH Texinfo-exception AND GFDL-1.3-or-later AND FSFAP AND FSFUL AND FSFULLR AND FSFULLRWD AND X11 AND LicenseRef-Fedora-Public-Domain

source:
  url: https://ftp.gnu.org/gnu/automake/automake-%{version}.tar.xz

# Only build for these flavors
flavors:
  - macos

requires:
  - m4
  - autoconf

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  optimization:
    O_level: 2
    strict_aliasing: true
  flavor_env:
    macos:
      - M4: "%{prefix}/bin/m4"
build:
  parallel: true

test:
  commands:
    - "make -j 8 check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"