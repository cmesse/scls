name: hwloc
version: 2.14.0
summary: Portable Hardware Locality
homepage: https://www-lb.open-mpi.org/software/hwloc/
license: BSD

# Not built for lbl (uses system hwloc for Slurm compatibility)
exclude_flavors:
  - lbl

source:
  # The vX.Y directory is the release series, not the full version, so it has
  # to be bumped together with version: above. There is no major.minor macro.
  url: https://download.open-mpi.org/release/hwloc/v2.14/hwloc-%{version}.tar.bz2

update:
  strategy: github_tag
  repo: open-mpi/hwloc
  tag_prefix: "hwloc-"

requires:
  - libevent

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  env:
    - CFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - CXXFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - LDFLAGS: "+=-DHAVE_UNIX_BYTESWAP"

  type: autotools
  args:
    - --disable-rocm
    - --disable-opencl
    - --disable-gl
    - --disable-levelzero
    - --disable-embedded-mode
    - --disable-libxml2
    - --disable-doxygen
    - --disable-cairo
    - --disable-readme

  flavor_args:
    debug:
      - --disable-cuda
      - --disable-nvml
    mkl:
      - --disable-cuda
      - --disable-nvml
    gcc-mkl-cuda:
      - --with-cuda=%{cuda}
      - --enable-nvml
    intel:
      - --disable-cuda
      - --disable-nvml
    macos:
      - --disable-cuda
      - --disable-nvml

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
