name: hwloc
version: 2.12.1
summary: Portable Hardware Locality
homepage: https://www-lb.open-mpi.org/software/hwloc/
license: BSD

source:
  url: https://download.open-mpi.org/release/hwloc/v2.12/hwloc-%{version}.tar.bz2

requires:
  - libevent

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  env:
    - CFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - CXXFLAGS: "+=-DHAVE_UNIX_BYTESWAP"
    - LDFLAGS: "+=-DHAVE_UNIX_BYTESWAP"

  type: autotools
  args:
    - --disable-rocm
    - --disable-opencl
    - --disable-gl
    - --disable-levelzero
    - --disable-embedded-mode
    - --disable-libxml2
    - --disable-doxygen
    - --disable-cairo
    - --disable-readme

  flavor_args:
    gcc-debug:
      - --disable-cuda
      - --disable-nvml
    clang-debug:
      - --disable-cuda
      - --disable-nvml
    gcc-mkl:
      - --disable-cuda
      - --disable-nvml
    gcc-mkl-cuda:
      - --with-cuda=%{cuda}
      - --enable-nvml
    intel-mkl:
      - --disable-cuda
      - --disable-nvml
    macos:
      - --disable-cuda
      - --disable-nvml

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"