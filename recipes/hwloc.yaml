name: hwloc
version: 2.12.1
summary: Portable Hardware Locality
homepage: https://www-lb.open-mpi.org/software/hwloc/
license: BSD

source:
  url: https://download.open-mpi.org/release/hwloc/v2.12/hwloc-{%version}.tar.bz2

requires:
  - libevent

features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  args:
    - --enable-cxx
    - --with-pic
  # Flavor-specific configure arguments
  flavor_args:
    gcc-debug:
      - --enable-fat
    clang-debug:
      - --enable-fat
    gcc-mkl:
      - --enable-fat
    intel-mkl:
      - --enable-fat
    macos:
      - --disable-assembly  # Avoid assembly issues on macOS
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"