name: libevent
version: 2.1.12
summary: Abstract asynchronous event notification library
homepage: https://libevent.org/
license: BSD and ISC

# Not built for lbl (uses system libevent for Slurm compatibility)
exclude_flavors:
  - lbl

source:
  url: https://github.com/libevent/libevent/releases/download/release-%{version}-stable/libevent-%{version}-stable.tar.gz

patches:
  - file: libevent_fix_python_shebang.patch
  - file: libevent-nonettests.patch
  - file: libevent-build-do-not-try-install-doxygen-man-pages-if-they-w.patch
  - file: libevent-build-add-doxygen-to-all.patch
  - file: libevent-Revert-Fix-checking-return-value-of-the-evdns_base_r.patch
  - file: libevent-ssl-test-use-sha256.patch

requires:
  macos:
    - openssl
    - automake
    - libtool
    - sed

rpm_build_requires:
  all:
      - openssl-devel
      - python3-devel

rpm_requires:
  all:
      - openssl
      - python3

features:
  fortran: false
  mpi: false
  openmp: false
  math: false


configure:
  type: autotools
  env:
    - CFLAGS: "+=-I%{prefix}/include"
    - CXXFLAGS: "+=-I%{prefix}/include"
    - LDFLAGS: "+=-L%{prefix}/lib -Wl,-rpath,%{prefix}/lib -lssl -lcrypto"
  pre:
    - "autoreconf -f -i"
    - "for f in $(find . -name configure); do sed -i 's/--version -v -V -qversion/--version -v/g' $f ; done"

  args:
    - -disable-dependency-tracking

  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

# Tests disabled: timing-sensitive tests (common_timeout) fail under rpmbuild load
# test:
#   commands:
#     - "make verify 2>&1 | tee check.log"