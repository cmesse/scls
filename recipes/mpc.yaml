name: mpc
version: 1.4.1
summary: C library for multiple-precision complex computations
homepage: https://www.multiprecision.org/
license: LGPL-3.0-or-later
# LGPL-3 — not redistributed as an SCLS package on mainline Linux flavors.
# GCC consumes mpc via its `extra_sources:` block and builds it in-tree,
# so the recipe remains as a source-only pointer there. Built in-stack
# only on `lbl` (LBL HPC target that maintains its own full toolchain).

source:
  url: https://ftp.gnu.org/gnu/mpc/mpc-%{version}.tar.xz

include_flavors:
  - lbl

requires:
  - gcc  # libmpc links libgcc_s; mpc is only built on lbl, which ships scls-lbl-gcc
  - gmp
  - mpfr


features:
  fortran: false
  mpi: false
  openmp: false
  math: false

configure:
  type: autotools
  args:
    - --enable-thread-safe
    - --with-gmp-include=%{prefix}/include
    - --with-gmp-lib=%{prefix}/lib
    - --with-mpfr-include=%{prefix}/include
    - --with-mpfr-lib=%{prefix}/lib

  # Flavor-specific configure arguments
  flavor_env:
    macos:
      - SED: "%{prefix}/bin/gsed"
  optimization:
    O_level: 2
    strict_aliasing: true

build:
  parallel: true

test:
  commands:
    - "make check 2>&1 | tee check.log"
  post:
    - "echo 'Test Summary:' && grep -E '^(PASS|FAIL|SKIP|XFAIL):' check.log || echo 'No test results found'"
