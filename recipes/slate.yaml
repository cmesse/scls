name: slate
version: 2025.05.28
summary: Software for Linear Algebra Targeting Exascale
homepage: https://icl.bitbucket.io/slate/
license: BSD-3-Clause

source:
  url: https://github.com/icl-utk-edu/slate/releases/download/v%{version}/slate-%{version}.tar.gz

patches:
  all:
    - slate_cmake.patch

requires:
  all:
    - cmake
    - blaspp
    - lapackpp
    - testsweeper

features:
  fortran: true
  mpi: true
  openmp: true
  math: parallel  # Uses ScaLAPACK

configure:
  type: cmake
  args:
    - "-DCMAKE_BUILD_TYPE=Release"
    - "-DCMAKE_INSTALL_LIBDIR=lib"
    - "-DBUILD_SHARED_LIBS=ON"
    - "-Dblaspp_DIR=%{prefix}"
    - "-Dlapackpp_DIR=%{prefix}"
  # LP64/ILP64: SLATE inherits integer interface from blaspp/lapackpp
  flavor_args:
    gcc:
      - "-Dgpu_backend=none"
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so;%{prefix}/lib/libopenblas.so"
    macos:
      - "-Dgpu_backend=none"
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.dylib;%{prefix}/lib/libopenblas.dylib"
    debug:
      - "-Dgpu_backend=none"
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so;%{prefix}/lib/liblapack.so;%{prefix}/lib/libblas.so"
    mkl:
      - "-Dgpu_backend=none"
      # ScaLAPACK: stack-owned build, layered on serial MKL BLAS/LAPACK.
      # Use %{mkl_linker_flags} (serial) not %{math_ldflags} so the line
      # does not carry a second -lscalapack from the parallel math expansion.
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so;%{mkl_linker_flags}"
    intel:
      - "-Dgpu_backend=none"
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so;%{mkl_linker_flags}"
    cuda:
      - "-Dgpu_backend=cuda"
      - "-DSCALAPACK_LIBRARIES=%{prefix}/lib/libscalapack.so;%{mkl_linker_flags}"
  optimization:
    O_level: 3

build:
  parallel: true
  in_source: false

# Tests cause timeout issues
# test:
#   commands:
#     - "make check"

registry:
  cflags: "-I%{prefix}/include"
  ldflags: "-L%{prefix}/lib -lslate -lslate_lapack_api"
